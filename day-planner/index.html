      <button type="button" id="syncDisconnectBtn" style="background:var(--white);border:1px solid var(--dark);color:var(--dark);padding:6px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;">Disconnect this device</button>
    `;
    document.getElementById("syncDisconnectBtn").onclick = () => {
      localStorage.removeItem(SYNC_TOKEN_KEY);
      localStorage.removeItem(SYNC_GIST_KEY);
      clearInterval(syncPollTimer);
      setSyncStatus();
      renderSyncPanel();
    };
  } else {
    box.innerHTML = `
      <p style="margin:0 0 8px;font-size:0.78rem;">Sync uses your GitHub account as the private cloud store — no new sign-up. Create a token at
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>
        &rarr; Fine-grained token &rarr; Repository access: <b>No access needed</b> &rarr; Account permissions &rarr; <b>Gists: Read and write</b>.</p>
      <label style="font-size:0.75rem;display:block;margin-bottom:3px;">Personal Access Token</label>
      <input type="password" id="syncTokenInput" style="width:100%;padding:5px 7px;border:1px solid var(--dark);border-radius:4px;font-size:0.78rem;margin-bottom:8px;" placeholder="github_pat_...">
      <label style="font-size:0.75rem;display:block;margin-bottom:3px;">Gist ID (leave blank on your first device)</label>
      <input type="text" id="syncGistInput" style="width:100%;padding:5px 7px;border:1px solid var(--dark);border-radius:4px;font-size:0.78rem;margin-bottom:10px;" placeholder="e.g. 8f2a1c...">
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" id="syncCreateBtn" style="background:var(--dark);color:var(--white);border:none;padding:7px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;">Create new synced planner</button>
        <button type="button" id="syncConnectBtn" style="background:var(--white);border:1px solid var(--dark);color:var(--dark);padding:7px 12px;border-radius:6px;font-size:0.75rem;cursor:pointer;">Connect to existing</button>
      </div>
      <p id="syncPanelError" style="color:#a33;font-size:0.72rem;margin-top:8px;"></p>
    `;
    const err = document.getElementById("syncPanelError");
    document.getElementById("syncCreateBtn").onclick = async () => {
      const token = document.getElementById("syncTokenInput").value.trim();
      if (!token) { err.textContent = "Enter a token first."; return; }
      localStorage.setItem(SYNC_TOKEN_KEY, token);
      err.textContent = "Creating…";
      try {
        await createSyncGist();
        renderSyncPanel();
        startSyncLoop();
      } catch (e) {
        localStorage.removeItem(SYNC_TOKEN_KEY);
        err.textContent = "Could not create sync store — check the token's permissions and try again.";
      }
    };
    document.getElementById("syncConnectBtn").onclick = async () => {
      const token = document.getElementById("syncTokenInput").value.trim();
      const id = document.getElementById("syncGistInput").value.trim();
      if (!token || !id) { err.textContent = "Enter both the token and the Gist ID from your other device."; return; }
      localStorage.setItem(SYNC_TOKEN_KEY, token);
      localStorage.setItem(SYNC_GIST_KEY, id);
      err.textContent = "Connecting…";
      try {
        await runSyncCycle();
        renderSyncPanel();
        startSyncLoop();
      } catch (e) {
        localStorage.removeItem(SYNC_TOKEN_KEY);
        localStorage.removeItem(SYNC_GIST_KEY);
        err.textContent = "Could not connect — check the token and Gist ID and try again.";
      }
    };
  }
}
document.getElementById("syncToggleBtn").addEventListener("click", () => {
  const modal = document.getElementById("syncModal");
  renderSyncPanel();
  modal.style.display = "flex";
});
document.getElementById("syncCloseBtn").addEventListener("click", () => {
  document.getElementById("syncModal").style.display = "none";
});
document.getElementById("syncModal").addEventListener("click", (e) => {
  if (e.target.id === "syncModal") document.getElementById("syncModal").style.display = "none";
});

/* ---- boot ---- */
render();
setSyncStatus();
startSyncLoop();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/day-planner/sw.js").catch(() => {
      /* offline support is a nice-to-have — a failed registration
         (e.g. running from a local file) shouldn't block the app */
    });
  });
}

</script>
