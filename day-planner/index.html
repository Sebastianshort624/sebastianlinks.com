<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day Planner</title>
<style>
  :root {
    --light: #E8F1F0;
    --white: #FFFFFF;
    --dark: #0D666A;
    --ink: #21302f; /* body text — necessary neutral for legibility, kept as dark as the dark-green so it reads as part of the same family */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--light);
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
  }
  button, input, select {
    font-family: inherit;
  }

  /* ===== SHELL ===== */
  .shell {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 10px 130px;
  }
  .crumbs {
    width: 100%;
    max-width: 1180px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--dark);
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .crumbs button {
    background: none;
    border: none;
    color: var(--dark);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 2px 4px;
    text-decoration: underline;
  }
  .crumbs .sep { color: var(--dark); opacity: 0.5; }
  .crumbs .current { font-weight: bold; text-decoration: none; }

  .zoom-row {
    width: 100%;
    max-width: 1180px;
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    padding: 0 4px;
    flex-wrap: wrap;
  }
  .zoom-btn {
    background: var(--white);
    border: 1px solid var(--dark);
    color: var(--dark);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  .zoom-btn.active {
    background: var(--dark);
    color: var(--white);
  }

  .nav-step-row {
    width: 100%;
    max-width: 1180px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 0 4px;
    margin-bottom: 10px;
  }
  .nav-step-btn {
    background: var(--dark);
    color: var(--white);
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    flex: 1;
    max-width: 220px;
  }
  .nav-step-btn:hover { opacity: 0.85; }
  .nav-step-btn:active { opacity: 0.7; }

  /* ===== BOOK ===== */
  .book-frame {
    width: 100%;
    max-width: 1180px;
    display: flex;
    perspective: 2400px;
  }
  .month-rail {
    display: flex;
    flex-direction: column;
    padding-top: 46px;
    flex-shrink: 0;
  }
  .month-tab {
    background: var(--dark);
    color: var(--white);
    border: none;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 10px 5px;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 0 6px 6px 0;
    margin-bottom: 3px;
    opacity: 0.55;
    transition: opacity 0.15s, padding 0.15s;
  }
  .month-tab.active {
    opacity: 1;
    padding-right: 10px;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.15);
  }
  .month-tab:hover { opacity: 0.85; }

  .book {
    flex: 1;
    background: var(--white);
    border-radius: 14px;
    box-shadow: 0 8px 28px rgba(13,102,106,0.22);
    min-height: 760px;
    display: flex;
    position: relative;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.15s ease;
  }
  .book.flip-fwd { animation: flipFwd 0.42s ease; }
  .book.flip-back { animation: flipBack 0.42s ease; }
  @keyframes flipFwd {
    0%   { transform: rotateY(0deg); filter: brightness(1); }
    45%  { transform: rotateY(-9deg); filter: brightness(0.88); }
    100% { transform: rotateY(0deg); filter: brightness(1); }
  }
  @keyframes flipBack {
    0%   { transform: rotateY(0deg); filter: brightness(1); }
    45%  { transform: rotateY(9deg); filter: brightness(0.88); }
    100% { transform: rotateY(0deg); filter: brightness(1); }
  }

  .holes {
    width: 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    background: var(--light);
    flex-shrink: 0;
  }
  .hole {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: inset 0 0 0 1.5px var(--dark);
  }

  .page {
    flex: 1;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow-y: auto;
  }
  .page.right-page { }
  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--dark);
    padding-bottom: 5px;
    margin-bottom: 6px;
  }
  .page-head h2 {
    margin: 0;
    color: var(--dark);
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .page-head .sub { font-size: 0.75rem; color: var(--dark); opacity: 0.8; }

  /* ===== YEAR / 6-MONTH / QUARTER GRID ===== */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    width: 100%;
  }
  .overview-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .overview-grid.cols-1 { grid-template-columns: 1fr; }
  .mini-month {
    border: 1px solid var(--dark);
    border-radius: 6px;
    overflow: hidden;
  }
  .mini-month-head {
    background: var(--dark);
    color: var(--white);
    text-align: center;
    padding: 5px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .mini-month-body {
    padding: 6px;
    font-size: 0.68rem;
  }
  .mini-week-row { display: flex; justify-content: space-between; padding: 1px 0; }
  .mini-day {
    width: 13%;
    text-align: center;
    color: var(--ink);
    cursor: pointer;
    border-radius: 3px;
  }
  .mini-day.has-event { background: var(--light); font-weight: bold; color: var(--dark); }
  .mini-day.empty { visibility: hidden; }

  /* ===== MONTH SPREAD ===== */
  table.month-cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.month-cal th {
    background: var(--white);
    color: var(--dark);
    border-bottom: 2px solid var(--dark);
    font-size: 0.72rem;
    padding: 4px 2px;
    text-align: left;
  }
  table.month-cal td {
    border: 1px solid var(--light);
    vertical-align: top;
    height: 78px;
    padding: 3px 4px;
    font-size: 0.7rem;
    cursor: pointer;
    position: relative;
  }
  table.month-cal td:hover { background: var(--light); }
  table.month-cal td .daynum { font-weight: bold; color: var(--dark); }
  table.month-cal td .ev { font-size: 0.62rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.month-cal td.notes-col { cursor: default; background: repeating-linear-gradient(var(--white), var(--white) 15px, var(--light) 16px); }
  table.month-cal td.notes-col:hover { background: repeating-linear-gradient(var(--white), var(--white) 15px, var(--light) 16px); }
  table.month-cal td.out-of-month { opacity: 0.45; }
  table.month-cal td.week-num-cell {
    width: 30px;
    background: var(--dark);
    color: var(--white);
    text-align: center;
    font-size: 0.6rem;
    font-weight: bold;
    vertical-align: middle;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    padding: 4px 0;
  }
  table.month-cal td.week-num-cell:hover { background: var(--ink); }
  table.month-cal th.week-num-head { width: 30px; }
  table.month-cal td.out-of-month .daynum { color: var(--ink); font-weight: normal; }

  /* ===== WEEK VIEW (matches Franklin weekly refill layout) ===== */
  .week-page-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 6px;
  }
  .week-page-head .wpk-title { text-align: center; flex: 1; }
  .week-page-head .wpk-title h2 { margin: 0; color: var(--dark); font-size: 1.05rem; }
  .week-page-head .wpk-title .wk-label { font-size: 0.68rem; color: var(--dark); opacity: 0.75; }
  .mini-cal { border: 1px solid var(--dark); border-collapse: collapse; font-size: 0.5rem; flex-shrink: 0; }
  .mini-cal th, .mini-cal td { border: 1px solid var(--light); text-align: center; padding: 1px 3px; color: var(--dark); }
  .mini-cal th { background: var(--dark); color: var(--white); }
  .mini-cal td.in-week { background: var(--light); font-weight: bold; }

  .week-body-row {
    display: flex;
    border-top: 2px solid var(--dark);
    border-left: 1px solid var(--dark);
  }
  .week-hour-axis { width: 46px; flex-shrink: 0; display: flex; flex-direction: column; }
  .week-axis-cell {
    height: 28px;
    font-size: 0.6rem;
    color: var(--dark);
    background: var(--light);
    border-right: 1px solid var(--dark);
    border-bottom: 1px solid var(--white);
    display: flex;
    align-items: center;
    padding: 0 3px;
    flex-shrink: 0;
  }
  .week-axis-cell.head-spacer { background: var(--white); }
  .week-axis-cell.tasks-label {
    height: auto;
    min-height: 44px;
    background: var(--dark);
    color: var(--white);
    font-weight: bold;
    text-align: center;
    justify-content: center;
    line-height: 1.15;
  }
  .week-day-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--dark);
    cursor: pointer;
  }
  .week-day-col:hover { background: var(--light); }
  .week-day-col.out-of-month { cursor: default; opacity: 0.35; }
  .week-col-head {
    height: 28px;
    background: var(--white);
    color: var(--dark);
    font-size: 0.7rem;
    font-weight: bold;
    text-align: center;
    border-bottom: 2px solid var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .week-day-col:hover .week-col-head { background: var(--dark); color: var(--white); }
  .week-cell-wrap {
    min-height: 28px;
    padding: 0 3px;
    border-bottom: 1px solid var(--light);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 3px;
  }
  .week-cell-wrap.has-event { background: var(--light); }
  .week-cell-lines { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .week-cell-line {
    font-size: 0.66rem;
    font-weight: bold;
    color: var(--dark);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 1px 0;
  }
  .week-cell-add {
    background: var(--white);
    border: 1px solid var(--dark);
    color: var(--dark);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    border-radius: 50%;
    font-size: 0.62rem;
    line-height: 1;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s;
  }
  .week-cell-wrap:hover .week-cell-add { opacity: 1; }
  .week-tasks-col {
    min-height: 60px;
    padding: 4px 5px;
    border-top: 2px solid var(--dark);
  }
  .week-tasks-col .wdt-item {
    font-size: 0.68rem;
    padding: 3px 0;
    border-bottom: 1px dotted var(--light);
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .week-tasks-col .wdt-empty { font-size: 0.62rem; opacity: 0.4; }
  .week-tasks-add {
    width: 100%;
    margin-top: 4px;
    background: none;
    border: 1px dashed var(--dark);
    color: var(--dark);
    font-size: 0.6rem;
    border-radius: 4px;
    padding: 3px 0;
    cursor: pointer;
  }
  .week-tasks-add:hover { background: var(--light); }

  .week-sunday-strip {
    margin-top: 6px;
    border: 1px dashed var(--dark);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 0.66rem;
    color: var(--dark);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
  }
  .week-sunday-strip:hover { background: var(--light); }

  /* ===== DAY VIEW ===== */
  .day-head-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .day-body-row { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; }
  .day-tasklist-col { width: 140px; flex-shrink: 0; border-right: 2px solid var(--dark); padding-right: 8px; }
  .day-tasklist-col h4, .day-schedule-col h4 {
    margin: 0 0 6px; color: var(--dark); font-size: 0.76rem; letter-spacing: 0.02em;
    border-bottom: 1px solid var(--dark); padding-bottom: 3px;
  }
  .day-task-item {
    font-size: 0.76rem; padding: 6px 2px; border-bottom: 1px dotted var(--light); cursor: pointer;
  }
  .day-task-item:hover { background: var(--light); }
  .day-task-empty { font-size: 0.72rem; opacity: 0.45; padding: 4px 0; }
  .day-task-add {
    width: 100%;
    margin-top: 6px;
    background: none;
    border: 1px dashed var(--dark);
    color: var(--dark);
    font-size: 0.68rem;
    border-radius: 4px;
    padding: 4px 0;
    cursor: pointer;
  }
  .day-task-add:hover { background: var(--light); }

  .day-schedule-col { flex: 1; min-width: 0; }
  .day-hour-row { display: flex; border-bottom: 1px solid var(--light); min-height: 28px; align-items: center; }
  .day-hour-row:hover { background: var(--light); }
  .day-hour-label { width: 60px; flex-shrink: 0; font-size: 0.7rem; color: var(--dark); padding: 6px 4px; }
  .day-hour-lines { flex: 1; min-width: 0; padding: 4px 0; display: flex; flex-direction: column; }
  .day-hour-line { font-size: 0.8rem; font-weight: bold; color: var(--dark); padding: 1px 0; cursor: pointer; }
  .day-hour-add {
    background: var(--white); border: 1px solid var(--dark); color: var(--dark);
    width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%;
    font-size: 0.75rem; line-height: 1; padding: 0; cursor: pointer;
    opacity: 0; transition: opacity 0.12s; margin-right: 6px;
  }
  .day-hour-row:hover .day-hour-add { opacity: 1; }

  .inline-edit-input {
    width: 100%; font-size: inherit; font-family: inherit; color: var(--ink);
    border: 1px solid var(--dark); border-radius: 3px; padding: 2px 4px; background: var(--white);
  }

  .notes-page {
    background-image: repeating-linear-gradient(var(--white) 0px, var(--white) 22px, var(--light) 23px);
    flex: 1;
    padding: 6px 4px;
  }
  .notes-page textarea {
    width: 100%;
    height: 100%;
    min-height: 380px;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
    font-family: Georgia, serif;
    font-size: 0.85rem;
    line-height: 23px;
    color: var(--ink);
  }
  .notes-hint { font-size: 0.68rem; color: var(--dark); opacity: 0.75; margin-top: 4px; }
  .notes-hint a { color: var(--dark); }

  .side-icons {
    width: 46px;
    background: var(--light);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 18px;
    gap: 14px;
    flex-shrink: 0;
    border-left: 1px solid var(--dark);
  }
  .side-icon-btn {
    background: var(--white);
    border: 1.5px solid var(--dark);
    color: var(--dark);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-icon-btn.on { background: var(--dark); color: var(--white); }
  .side-icon-label { font-size: 0.5rem; text-align: center; color: var(--dark); line-height: 1.1; }

  /* ===== TASK BAR (bottom, fixed) ===== */
  .taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--dark);
    color: var(--white);
    padding: 8px 16px 10px;
    max-height: 130px;
    overflow-y: auto;
  }
  .taskbar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .taskbar-head h3 { margin: 0; font-size: 0.78rem; letter-spacing: 0.04em; }
  .taskbar-add-btn {
    background: var(--white); color: var(--dark); border: none; border-radius: 5px;
    padding: 3px 10px; font-size: 0.72rem; cursor: pointer; font-weight: bold;
  }
  .taskbar-row { display: grid; grid-template-columns: 1fr 110px 80px 60px; gap: 8px; font-size: 0.75rem; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.15); align-items: center; }
  .taskbar-row.header-row { font-weight: bold; opacity: 0.8; border-bottom: 1px solid rgba(255,255,255,0.4); }
  .taskbar-row .del-btn { background: none; border: none; color: var(--white); cursor: pointer; font-size: 0.7rem; text-decoration: underline; opacity: 0.85; }
  .taskbar-empty { font-size: 0.75rem; opacity: 0.7; padding: 6px 0; }

  .add-form {
    display: none;
    grid-template-columns: 1fr 130px 90px 70px;
    gap: 8px;
    margin-bottom: 6px;
  }
  .add-form.open { display: grid; }
  .add-form input {
    padding: 4px 6px; border-radius: 4px; border: none; font-size: 0.75rem;
  }
  .add-form button { background: var(--white); color: var(--dark); border: none; border-radius: 4px; font-size: 0.72rem; font-weight: bold; cursor: pointer; }

  @media (max-width: 720px) {
    .month-rail { padding-top: 30px; }
    .month-tab { font-size: 0.6rem; padding: 6px 3px; }
    .book { min-height: 500px; }
    .overview-grid { grid-template-columns: 1fr; }
    .overview-grid.cols-3 { grid-template-columns: 1fr; }
    .page { padding: 12px; }
    .side-icons { width: 38px; }
    .taskbar-row, .add-form { grid-template-columns: 1fr 90px 60px 40px; }
    .nav-step-row { flex-direction: column; }
    .nav-step-btn { max-width: none; padding: 10px 12px; font-size: 0.85rem; }
    table.month-cal td.week-num-cell { width: 22px; font-size: 0.52rem; }
    table.month-cal th.week-num-head { width: 22px; }
    table.month-cal td { height: 60px; font-size: 0.62rem; }
    .day-tasklist-col { width: 110px; }
    .day-body-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="crumbs" id="crumbs"></div>

  <div class="zoom-row" id="zoomRow"></div>
  <div class="nav-step-row" id="navStepRow"></div>
  <div style="width:100%;max-width:1180px;display:flex;justify-content:flex-end;padding:0 4px 8px;">
    <button id="exportBtn" style="background:var(--white);border:1px solid var(--dark);color:var(--dark);padding:6px 14px;border-radius:999px;font-size:0.75rem;cursor:pointer;">⬇ Export Planner Data (backup)</button>
  </div>

  <div class="book-frame">
    <div class="month-rail" id="monthRail"></div>
    <div class="book" id="book">
      <div class="page" id="pageLeft"></div>
      <div class="holes" id="holesLeft"></div>
      <div class="page right-page" id="pageRight"></div>
      <div class="side-icons" id="sideIcons" style="display:none;"></div>
    </div>
  </div>
</div>

<div class="taskbar">
  <div class="taskbar-head">
    <h3 id="taskbarTitle">TASKS</h3>
    <button class="taskbar-add-btn" id="addToggleBtn">+ Add</button>
  </div>
  <div class="add-form" id="addForm">
    <input type="text" id="addTitle" placeholder="Title">
    <input type="date" id="addDate">
    <input type="time" id="addTime">
    <button id="addSubmit">Add</button>
  </div>
  <div class="taskbar-row header-row">
    <span>Title</span><span>Date</span><span>Time</span><span></span>
  </div>
  <div id="taskbarList"></div>
</div>

<script>
/* ============================================================
   DAY PLANNER — connected Year/6-Month/Quarter/Month/Week/Day/Hourly
   Data lives in localStorage. Notes reuse the existing web-notes
   localStorage keys (webnotes_active / webnotes_stored) so this
   integrates with, rather than replaces, /web-notes.
   ============================================================ */

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

const EVENTS_KEY = "plannerEvents";
const DAYMETA_PREFIX = "plannerDayMeta_";
const NOTES_ACTIVE_KEY = "webnotes_active"; // shared with /web-notes

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function dateStr(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
function todayStr() { const t = new Date(); return dateStr(t.getFullYear(), t.getMonth(), t.getDate()); }

function getEvents() {
  try { return JSON.parse(localStorage.getItem(EVENTS_KEY)) || []; } catch(e) { return []; }
}
function setEvents(list) { localStorage.setItem(EVENTS_KEY, JSON.stringify(list)); }
function eventsFor(dateISO) { return getEvents().filter(e => e.date === dateISO).sort((a,b)=> (a.time||"").localeCompare(b.time||"")); }
function eventsInRange(startISO, endISO) {
  return getEvents().filter(e => e.date >= startISO && e.date <= endISO).sort((a,b)=> a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||""));
}
function getDayMeta(dateISO) {
  try { return JSON.parse(localStorage.getItem(DAYMETA_PREFIX + dateISO)) || {alarms:false, notifications:false, textNotifications:false, emailNotifications:false}; }
  catch(e) { return {alarms:false, notifications:false, textNotifications:false, emailNotifications:false}; }
}
function setDayMeta(dateISO, meta) { localStorage.setItem(DAYMETA_PREFIX + dateISO, JSON.stringify(meta)); }

function getNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_ACTIVE_KEY)) || []; } catch(e) { return []; }
}
function setNotes(list) { localStorage.setItem(NOTES_ACTIVE_KEY, JSON.stringify(list)); }

/* ---- calendar math ---- */
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
function firstDow(y, m) { return new Date(y, m, 1).getDay(); }

function computeMonthWeeks(y, m) {
  const weeks = [];
  const total = daysInMonth(y, m);
  const startDow = firstDow(y, m);
  let cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= total; d++) {
    cells.push(d);
    if (cells.length === 7) { weeks.push(cells); cells = []; }
  }
  if (cells.length) {
    while (cells.length < 7) cells.push(null);
    weeks.push(cells);
  }
  return weeks;
}

/* ---- state ---- */
const state = {
  year: new Date().getFullYear(),
  level: "year",     // year | sixmonth | quarter | month | week | day
  month: new Date().getMonth(), // 0-11
  weekIndex: null,
  day: null          // ISO date
};

/* ---- sound: synthesized paper-flip via WebAudio (no external asset needed) ---- */
let audioCtx = null;
function playFlipSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.28;
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const t = i / bufferSize;
      const env = Math.sin(Math.PI * t) * (1 - t * 0.3);
      data[i] = (Math.random() * 2 - 1) * env;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 1200;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.35;
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  } catch(e) { /* audio unavailable — silently skip */ }
}

function flipTo(fn, dir) {
  const book = document.getElementById("book");
  playFlipSound();
  book.classList.remove("flip-fwd","flip-back");
  void book.offsetWidth;
  book.classList.add(dir === "back" ? "flip-back" : "flip-fwd");
  fn();
  render();
  setTimeout(() => book.classList.remove("flip-fwd","flip-back"), 450);
}

/* ---- navigation setters ---- */
function goYear() { state.level = "year"; }
function goSixMonth() { state.level = "sixmonth"; }
function goQuarter() { state.level = "quarter"; }
function goMonth(m) { state.month = m; state.level = "month"; state.weekIndex = null; }
function goWeek(idx) { state.weekIndex = idx; state.level = "week"; }
function goDay(iso) { state.day = iso; state.level = "day"; }

/* ---- step forward/backward one unit at the current view level.
   Handles month/year boundary crossings so repeated clicks page
   through correctly (e.g. Week view rolling from the last week of
   one month into the first week of the next). ---- */
function stepView(dir) {
  if (state.level === "year") {
    state.year += dir;
  } else if (state.level === "sixmonth") {
    if (dir > 0) {
      if (state.month < 6) state.month = 6;
      else { state.month = 0; state.year += 1; }
    } else {
      if (state.month >= 6) state.month = 0;
      else { state.month = 6; state.year -= 1; }
    }
  } else if (state.level === "quarter") {
    let q = Math.floor(state.month / 3) + dir;
    if (q < 0) { q = 3; state.year -= 1; }
    if (q > 3) { q = 0; state.year += 1; }
    state.month = q * 3;
  } else if (state.level === "month") {
    let nm = state.month + dir;
    if (nm < 0) { nm = 11; state.year -= 1; }
    if (nm > 11) { nm = 0; state.year += 1; }
    state.month = nm;
    state.weekIndex = null;
  } else if (state.level === "week") {
    const weeks = computeMonthWeeks(state.year, state.month);
    let idx = (state.weekIndex === null ? 0 : state.weekIndex) + dir;
    if (idx < 0) {
      let pm = state.month - 1, py = state.year;
      if (pm < 0) { pm = 11; py -= 1; }
      state.month = pm; state.year = py;
      state.weekIndex = computeMonthWeeks(py, pm).length - 1;
    } else if (idx >= weeks.length) {
      let nm = state.month + 1, ny = state.year;
      if (nm > 11) { nm = 0; ny += 1; }
      state.month = nm; state.year = ny;
      state.weekIndex = 0;
    } else {
      state.weekIndex = idx;
    }
  } else if (state.level === "day") {
    const cur = new Date((state.day || todayStr()) + "T00:00:00");
    cur.setDate(cur.getDate() + dir);
    const y = cur.getFullYear(), m = cur.getMonth(), dnum = cur.getDate();
    state.day = dateStr(y, m, dnum);
    state.month = m;
    state.year = y;
    state.weekIndex = findWeekIndexForDate(y, m, dnum);
  }
}

/* ---- YEAR ---- */
function renderYear(left, right) {
  left.innerHTML = `<div class="page-head"><h2>${state.year} — Year at a Glance</h2><span class="sub">Tap a month</span></div><div class="overview-grid" id="yg1"></div>`;
  right.innerHTML = `<div class="page-head"><h2>&nbsp;</h2></div><div class="overview-grid" id="yg2"></div>`;
  const g1 = left.querySelector("#yg1"), g2 = right.querySelector("#yg2");
  for (let m = 0; m < 12; m++) {
    const target = m < 6 ? g1 : g2;
    target.appendChild(miniMonth(state.year, m));
  }
}

function miniMonth(y, m) {
  const wrap = document.createElement("div");
  wrap.className = "mini-month";
  const weeks = computeMonthWeeks(y, m);
  const first = dateStr(y, m, 1);
  const last = dateStr(y, m, daysInMonth(y, m));
  const evs = eventsInRange(first, last);
  const evDays = new Set(evs.map(e => e.date));
  let body = `<div class="mini-week-row">${DOW.map(d=>`<span class="mini-day" style="cursor:default;font-weight:bold;color:var(--dark)">${d[0]}</span>`).join("")}</div>`;
  weeks.forEach(week => {
    body += `<div class="mini-week-row">` + week.map(d => {
      if (d === null) return `<span class="mini-day empty">.</span>`;
      const iso = dateStr(y, m, d);
      const cls = evDays.has(iso) ? "mini-day has-event" : "mini-day";
      return `<span class="${cls}" onclick="flipTo(()=>{goMonth(${m}); },'fwd')">${d}</span>`;
    }).join("") + `</div>`;
  });
  wrap.innerHTML = `<div class="mini-month-head" onclick="flipTo(()=>goMonth(${m}),'fwd')">${MONTHS[m]}</div><div class="mini-month-body">${body}</div>`;
  return wrap;
}

/* ---- 6-MONTH ---- */
function renderSixMonth(left, right) {

/* ---- QUARTER ---- */
function renderQuarter(left, right) {

/* ---- full month grid including adjacent-month dates, for Month view only.
   computeMonthWeeks() (used by Year/6-Month/Quarter thumbnails and Week view)
   is left untouched — this is a separate function so nothing else is affected. */
function computeMonthGridFull(y, m) {
  const firstOfMonth = new Date(y, m, 1);
  const startDow = firstOfMonth.getDay();
  const cursor = new Date(y, m, 1 - startDow);
  const lastOfMonth = new Date(y, m, daysInMonth(y, m));
  const weeks = [];
  while (true) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      week.push({
        day: cursor.getDate(),
        month: cursor.getMonth(),
        year: cursor.getFullYear(),
        inMonth: cursor.getMonth() === m && cursor.getFullYear() === y
      });
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
    if (cursor > lastOfMonth) break;
  }
  return weeks;
}
function findWeekIndexForDate(y, m, day) {
  const weeks = computeMonthWeeks(y, m);
  for (let i = 0; i < weeks.length; i++) if (weeks[i].includes(day)) return i;
  return 0;
}

/* ---- MONTH (two-page spread like the reference) ---- */
function renderMonth(left, right) {
  const y = state.year, m = state.month;
  const weeks = computeMonthGridFull(y, m);
  left.innerHTML = `<div class="page-head"><h2>${MONTHS_FULL[m]} ${y}</h2><span class="sub">${weeks.length} weeks</span></div>`;
  right.innerHTML = `<div class="page-head"><h2>${MONTHS_FULL[m]} ${y}</h2><span class="sub">Notes</span></div>`;

  const tableL = document.createElement("table");
  tableL.className = "month-cal";
  tableL.innerHTML = `<thead><tr><th class="week-num-head">Wk</th>${["Sunday","Monday","Tuesday","Wednesday"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbodyL = document.createElement("tbody");

  tableR.className = "month-cal";
  tableR.innerHTML = `<thead><tr>${["Thursday","Friday","Saturday","Notes"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>`;
  const tbodyR = document.createElement("tbody");

  function cellHtml(cell) {
    const iso = dateStr(cell.year, cell.month, cell.day);
    const evs = eventsFor(iso);
    const dim = cell.inMonth ? "" : "out-of-month";
    return `<td class="${dim}" data-iso="${iso}" data-cell-month="${cell.month}" data-cell-year="${cell.year}" data-cell-day="${cell.day}">
      <div class="daynum">${cell.day}</div>
      ${evs.slice(0,3).map(e=>`<div class="ev">${escapeHtml(e.title)}</div>`).join("")}
    </td>`;
  }

  weeks.forEach((week, wi) => {
    const trL = document.createElement("tr");
    trL.innerHTML += `<td class="week-num-cell" data-week-index="${wi}">Wk ${wi+1}</td>`;
    for (let di = 0; di < 4; di++) trL.innerHTML += cellHtml(week[di]);
    tbodyL.appendChild(trL);

    const trR = document.createElement("tr");
    for (let di = 4; di < 7; di++) trR.innerHTML += cellHtml(week[di]);
    trR.innerHTML += `<td class="notes-col"></td>`;
    tbodyR.appendChild(trR);
  });

  tableL.appendChild(tbodyL);
  tableR.appendChild(tbodyR);
  left.appendChild(tableL);

  // Week-number button — jumps straight to Week view for that row,

    td.addEventListener("click", () => {
      const wi = parseInt(td.dataset.weekIndex, 10);
      flipTo(() => { goMonth(m); goWeek(wi); }, "fwd");
    });
  });

  // exact-date click — reads the real date off the cell, including
  // adjacent-month dates, and jumps straight to that Day view
  [tableL, tableR].forEach(t => {
    t.querySelectorAll("td[data-iso]").forEach(td => {
      td.addEventListener("click", () => {
        const cy = parseInt(td.dataset.cellYear, 10);
        const cm = parseInt(td.dataset.cellMonth, 10);
        const cd = parseInt(td.dataset.cellDay, 10);
        const iso = td.dataset.iso;
        flipTo(() => {
          goMonth(cm);
          state.year = cy;
          goWeek(findWeekIndexForDate(cy, cm, cd));
          goDay(iso);
        }, "fwd");
      });
    });
  });
}

/* ---- WEEK ----
   Matches the Franklin weekly refill: shared hour axis (8am–7pm) down
   the left edge, three day columns beside it per page, Daily Tasks
   footer row beneath (untimed entries). Sunday gets a compact strip
   under the Thu–Sat page, same placement as the reference image,
   rather than a fourth full column — still clickable through to
   that day's full Daily view. */
const WEEK_HOURS_START = 8;
const WEEK_HOURS_END = 19; // 7pm

function miniWeekCalendar(y, m, weekDates) {
  const weeks = computeMonthWeeks(y, m);
  const inWeekSet = new Set(weekDates.filter(d => d !== null));
  let html = `<table class="mini-cal"><tr>${DOW.map(d=>`<th>${d[0]}</th>`).join("")}</tr>`;
  weeks.forEach(week => {
    html += "<tr>" + week.map(d => {
      if (d === null) return "<td></td>";
      const cls = inWeekSet.has(d) ? "in-week" : "";
      return `<td class="${cls}">${d}</td>`;
    }).join("") + "</tr>";
  });
  html += "</table>";
  return html;
}

function renderWeek(left, right) {
  const y = state.year, m = state.month;
  const weeks = computeMonthWeeks(y, m);
  const idx = state.weekIndex === null ? 0 : state.weekIndex;
  const week = weeks[idx] || weeks[0];
  const realDays = week.filter(d => d !== null);
  const rangeLabel = realDays.length
    ? `${MONTHS[m]} ${realDays[0]}–${realDays[realDays.length-1]}`
    : MONTHS_FULL[m];

  const monWed = week.slice(1, 4); // Mon, Tue, Wed
  const thuSat = week.slice(4, 7); // Thu, Fri, Sat
  const sunday = week[0];

  function buildPage(container, dayNums, dayIndices, extraHtml) {
    let axisHtml = `<div class="week-axis-cell head-spacer"></div>`;
    for (let h = WEEK_HOURS_START; h <= WEEK_HOURS_END; h++) {
      const label = h===12 ? "12" : h<12 ? h : (h-12);
      const ampm = h < 12 ? "am" : "pm";
      axisHtml += `<div class="week-axis-cell">${label} ${ampm}</div>`;
    }
    axisHtml += `<div class="week-axis-cell tasks-label">Daily Tasks</div>`;

    let colsHtml = "";
    dayNums.forEach((d, i) => {
      const di = dayIndices[i];
      if (d === null) {
        colsHtml += `<div class="week-day-col out-of-month">
          <div class="week-col-head">${DOW_FULL[di]}</div>
          ${Array(WEEK_HOURS_END-WEEK_HOURS_START+1).fill('<div class="week-cell-wrap"><div class="week-cell-lines"></div></div>').join("")}
          <div class="week-tasks-col"></div>
        </div>`;
        return;
      }
      const iso = dateStr(y, m, d);
      const evs = eventsFor(iso);
      let cellsHtml = "";
      for (let h = WEEK_HOURS_START; h <= WEEK_HOURS_END; h++) {
        const hourEvs = evs.filter(e => e.time && parseInt(e.time.split(":")[0],10) === h);
        const linesHtml = hourEvs.map(ev => `<div class="week-cell-line" data-event-id="${ev.id}">${escapeHtml(ev.title)}</div>`).join("");
        cellsHtml += `<div class="week-cell-wrap ${hourEvs.length?'has-event':''}" data-iso="${iso}" data-hour="${h}">
          <div class="week-cell-lines">${linesHtml}</div>
          <button type="button" class="week-cell-add" data-iso="${iso}" data-hour="${h}" title="Add another">+</button>
        </div>`;
      }
      const untimed = evs.filter(e => !e.time);
      const tasksHtml = untimed.length
        ? untimed.map(e=>`<div class="wdt-item" data-event-id="${e.id}">${escapeHtml(e.title)}</div>`).join("")
        : `<div class="wdt-empty">—</div>`;

      colsHtml += `<div class="week-day-col" data-iso="${iso}">
        <div class="week-col-head">${DOW_FULL[di]} ${d}</div>
        ${cellsHtml}
        <div class="week-tasks-col">
          <div class="week-tasks-lines">${tasksHtml}</div>
          <button type="button" class="week-tasks-add" data-iso="${iso}">+ Add task</button>
        </div>
      </div>`;
    });

    // single write: day columns + any trailing content (e.g. the Sunday
    // strip) go in together, so nothing appends to this container's
    // innerHTML afterward and silently destroys the listeners below
    container.innerHTML += `<div class="week-body-row">
      <div class="week-hour-axis">${axisHtml}</div>
      ${colsHtml}
    </div>${extraHtml || ""}`;

    container.querySelectorAll(".week-day-col[data-iso]").forEach(col => {
      let clickTimer = null;
      col.addEventListener("click", (e) => {
        if (e.target.closest(".week-cell-add")) return; // handled by its own listener
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => flipTo(() => goDay(col.dataset.iso), "fwd"), 230);
      });
      col.addEventListener("dblclick", (e) => {
        clearTimeout(clickTimer);
        if (e.target.closest(".week-cell-add")) return;
        const lineEl = e.target.closest(".week-cell-line[data-event-id], .wdt-item[data-event-id]");
        if (lineEl) { startInlineEdit(lineEl, lineEl.dataset.eventId); return; }
        const wrap = e.target.closest(".week-cell-wrap[data-hour]");
        if (wrap) createEventInline(wrap.querySelector(".week-cell-lines"), wrap.dataset.iso, parseInt(wrap.dataset.hour, 10));
      });
      col.querySelectorAll(".week-cell-add").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          clearTimeout(clickTimer);
          const wrap = btn.closest(".week-cell-wrap");
          createEventInline(wrap.querySelector(".week-cell-lines"), wrap.dataset.iso, parseInt(wrap.dataset.hour, 10));
        });
      });
      col.querySelectorAll(".week-tasks-add").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          clearTimeout(clickTimer);
          const linesEl = btn.closest(".week-tasks-col").querySelector(".week-tasks-lines");
          createEventInline(linesEl, btn.dataset.iso, null);
        });
      });
    });
  }

  left.innerHTML = `<div class="week-page-head">
      <div class="wpk-title"><h2>${rangeLabel}</h2><span class="wk-label">Week ${idx+1}</span></div>
      ${miniWeekCalendar(y, m, week)}
    </div>`;
  buildPage(left, monWed, [1,2,3]);

  let sundayHtml = "";
  if (sunday !== null) {
    const isoSun = dateStr(y, m, sunday);
    const evsSun = eventsFor(isoSun);
    const summary = evsSun.length ? evsSun.slice(0,3).map(e=>escapeHtml(e.title)).join(", ") : "No entries";
    sundayHtml = `<div class="week-sunday-strip" data-iso="${isoSun}">
      <span><strong>Sunday ${sunday}</strong></span><span>${summary}</span>
    </div>`;
  }

  right.innerHTML = `<div class="week-page-head">
      <div class="wpk-title"><h2>${rangeLabel}</h2><span class="wk-label">${y}</span></div>
      ${miniWeekCalendar(y, m, week)}
    </div>`;
  buildPage(right, thuSat, [4,5,6], sundayHtml);

  const sundayEl = right.querySelector(".week-sunday-strip[data-iso]");
  if (sundayEl) {
    sundayEl.addEventListener("click", () => flipTo(() => goDay(sundayEl.dataset.iso), "fwd"));
  }
}

/* ---- DAY ---- */
function miniMonthSingleDay(y, m, day) {
  const weeks = computeMonthWeeks(y, m);
  let html = `<table class="mini-cal"><tr>${DOW.map(d=>`<th>${d[0]}</th>`).join("")}</tr>`;
  weeks.forEach(week => {
    html += "<tr>" + week.map(d => {
      if (d === null) return "<td></td>";
      const cls = d === day ? "in-week" : "";
      return `<td class="${cls}">${d}</td>`;
    }).join("") + "</tr>";
  });
  html += "</table>";
  return html;
}

function renderDay(left, right) {
  const iso = state.day || todayStr();
  const d = new Date(iso + "T00:00:00");
  const evs = eventsFor(iso);
  const timed = evs.filter(e => e.time);
  const untimed = evs.filter(e => !e.time);

  left.innerHTML = `
    <div class="day-head-row">
      <div><h2 style="margin:0;color:var(--dark);font-size:1.15rem;">${d.getDate()}</h2>
      <span class="sub">${DOW_FULL[d.getDay()]}<br>${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}</span></div>
      ${miniMonthSingleDay(d.getFullYear(), d.getMonth(), d.getDate())}
    </div>
    <div class="day-body-row" id="dayBody"></div>
  `;
  const bodyRow = left.querySelector("#dayBody");

  // Daily Task List (untimed entries) — double-click a line to edit
  // it in place; "+ Add task" appends a new one
  const taskCol = document.createElement("div");
  taskCol.className = "day-tasklist-col";
  taskCol.innerHTML = `<h4>Daily Task List</h4>`;
  const taskLines = document.createElement("div");
  taskLines.className = "day-task-lines";
  if (!untimed.length) {
    taskLines.innerHTML = `<div class="day-task-empty">No tasks yet</div>`;
  } else {
    untimed.forEach(e => {
      const item = document.createElement("div");
      item.className = "day-task-item";
      item.dataset.eventId = e.id;
      item.textContent = e.title;
      item.addEventListener("dblclick", () => startInlineEdit(item, e.id));
      taskLines.appendChild(item);
    });
  }
  taskCol.appendChild(taskLines);
  const taskAddBtn = document.createElement("button");
  taskAddBtn.type = "button";
  taskAddBtn.className = "day-task-add";
  taskAddBtn.textContent = "+ Add task";
  taskAddBtn.addEventListener("click", () => createEventInline(taskLines, iso, null));
  taskCol.appendChild(taskAddBtn);
  bodyRow.appendChild(taskCol);

  // Appointment Schedule (timed entries) — same hour range and row
  // height as Weekly view. Each hour supports multiple entries:
  // double-click an existing line to edit it, double-click empty
  // space (or the + button) to add another entry to that hour.
  const schedCol = document.createElement("div");
  schedCol.className = "day-schedule-col";
  schedCol.innerHTML = `<h4>Appointment Schedule</h4>`;
  for (let h = WEEK_HOURS_START; h <= WEEK_HOURS_END; h++) {
    const hourEvs = timed.filter(e => parseInt(e.time.split(":")[0],10) === h);
    const label = h===12 ? "12 PM" : h<12 ? h+" AM" : (h-12)+" PM";
    const row = document.createElement("div");
    row.className = "day-hour-row" + (hourEvs.length ? " has-event" : "");
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "day-hour-add";
    addBtn.title = "Add another";
    addBtn.textContent = "+";
    const linesWrap = document.createElement("div");
    linesWrap.className = "day-hour-lines";
    hourEvs.forEach(ev => {
      const line = document.createElement("div");
      line.className = "day-hour-line";
      line.dataset.eventId = ev.id;
      line.textContent = ev.title;
      line.addEventListener("dblclick", (e) => { e.stopPropagation(); startInlineEdit(line, ev.id); });
      linesWrap.appendChild(line);
    });
    row.innerHTML = `<div class="day-hour-label">${label}</div>`;
    row.appendChild(addBtn);
    row.appendChild(linesWrap);
    addBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      createEventInline(linesWrap, iso, h);
    });
    row.addEventListener("dblclick", (e) => {
      if (e.target.closest(".day-hour-line") || e.target.closest(".day-hour-add")) return;
      createEventInline(linesWrap, iso, h);
    });
    schedCol.appendChild(row);
  }
  bodyRow.appendChild(schedCol);

  // ---- Daily Notes (right page) — UNCHANGED from prior behavior,
  // still shared with /web-notes via webnotes_active ----
  right.innerHTML = `<div class="page-head"><h2>Daily Notes</h2><span class="sub">Shared with /web-notes</span></div><div class="notes-page"><textarea id="dayNoteBox" placeholder="Write today's notes..."></textarea><div class="notes-hint">Saving here adds it to your <a href="/web-notes/" target="_blank">Web Notes</a> list.</div></div>`;
  const noteBox = right.querySelector("#dayNoteBox");
  const existing = getNotes().find(n => n.dayKey === iso);
  if (existing) noteBox.value = existing.text;
  let saveTimer;
  noteBox.addEventListener("input", () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const notes = getNotes();
      const idx = notes.findIndex(n => n.dayKey === iso);
      const text = noteBox.value;
      if (idx >= 0) {
        if (text.trim() === "") { notes.splice(idx,1); } else { notes[idx].text = text; }
      } else if (text.trim() !== "") {
        notes.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), text, created: Date.now(), dayKey: iso });
      }
      setNotes(notes);
    }, 500);
  });
}

function wireScratchNote(textarea) {
  if (!textarea) return;
  const key = "plannerScratch_" + textarea.dataset.notekey;
  textarea.value = localStorage.getItem(key) || "";
  textarea.addEventListener("input", () => localStorage.setItem(key, textarea.value));
}

/* ---- TASK BAR ---- */
function currentRangeLabel() {
  if (state.level === "year") return `TASKS — ${state.year}`;
  if (state.level === "sixmonth") return `TASKS — ${state.month<6?"Jan–Jun":"Jul–Dec"} ${state.year}`;
  if (state.level === "quarter") return `TASKS — Q${Math.floor(state.month/3)+1} ${state.year}`;
  if (state.level === "month") return `TASKS — ${MONTHS_FULL[state.month]} ${state.year}`;
  if (state.level === "week") return `TASKS — Week ${state.weekIndex!==null?state.weekIndex+1:1}`;
  if (state.level === "day") return `TASKS — ${state.day || todayStr()}`;
  return "TASKS";
}
function currentRangeEvents() {
  const y = state.year, m = state.month;
  if (state.level === "year") return eventsInRange(dateStr(y,0,1), dateStr(y,11,daysInMonth(y,11)));
  if (state.level === "sixmonth") {
    const start = state.month < 6 ? 0 : 6, end = start+5;
    return eventsInRange(dateStr(y,start,1), dateStr(y,end,daysInMonth(y,end)));
  }
  if (state.level === "quarter") {
    const q = Math.floor(m/3), start = q*3, end = start+2;
    return eventsInRange(dateStr(y,start,1), dateStr(y,end,daysInMonth(y,end)));
  }
  if (state.level === "month") return eventsInRange(dateStr(y,m,1), dateStr(y,m,daysInMonth(y,m)));
  if (state.level === "week") {
    const weeks = computeMonthWeeks(y,m);
    const idx = state.weekIndex===null?0:state.weekIndex;
    const week = weeks[idx] || weeks[0];
    const days = week.filter(d=>d!==null);
    if (!days.length) return [];
    return eventsInRange(dateStr(y,m,days[0]), dateStr(y,m,days[days.length-1]));
  }
  if (state.level === "day") return eventsFor(state.day || todayStr());
  return [];
}

function renderTaskbar() {
  document.getElementById("taskbarTitle").textContent = currentRangeLabel();
  const evs = currentRangeEvents();
  const list = document.getElementById("taskbarList");
  if (!evs.length) { list.innerHTML = `<div class="taskbar-empty">No tasks in this view yet.</div>`; return; }
  list.innerHTML = evs.map(e => `
    <div class="taskbar-row">
      <span>${escapeHtml(e.title)}</span>
      <span>${e.date}</span>
      <span>${e.time || "—"}</span>
      <button class="del-btn" onclick="deleteEvent('${e.id}')">Delete</button>
    </div>
  `).join("");
}

function deleteEvent(id) {
  setEvents(getEvents().filter(e => e.id !== id));
  render();
}

/* ---- shared inline-edit: used by Weekly hour cells/task items and
   Daily task list/appointment schedule. Double-click on an existing
   event line turns it into an editable text field in place — no need
   to go through Add → enter time → create. Enter/blur saves; Escape
   or an empty value cancels/deletes. */
function startInlineEdit(el, eventId) {
  const evs = getEvents();
  const ev = evs.find(e => e.id === eventId);
  if (!ev) return;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "inline-edit-input";
  input.value = ev.title;
  el.innerHTML = "";
  el.appendChild(input);
  input.focus();
  input.select();

  let settled = false;
  function commit() {
    if (settled) return;
    settled = true;
    const newTitle = input.value.trim();
    const list = getEvents();
    const idx = list.findIndex(e2 => e2.id === eventId);
    if (idx >= 0) {
      if (newTitle === "") list.splice(idx, 1);
      else list[idx].title = newTitle;
      setEvents(list);
    }
    render();
  }
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    if (e.key === "Escape") { settled = true; render(); }
  });
  input.addEventListener("blur", commit);
}

/* ---- creates a brand-new event inline, for a specific day and
   optionally an hour. Pass hour=null for an untimed (task-list) entry.
   Used when double-clicking an empty hour, or any "+" add button —
   appends rather than replaces. */
function createEventInline(linesContainer, iso, hour) {
  const input = document.createElement("input");
  input.type = "text";
  input.className = "inline-edit-input";
  input.placeholder = "New task…";
  linesContainer.appendChild(input);
  input.focus();

  let settled = false;
  function commit() {
    if (settled) return;
    settled = true;
    const title = input.value.trim();
    if (title !== "") {
      const list = getEvents();
      list.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        title,
        date: iso,
        time: hour === null ? "" : (pad(hour) + ":00"),
        createdAt: Date.now()
      });
      setEvents(list);
    }
    render();
  }
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    if (e.key === "Escape") { settled = true; render(); }
  });
  input.addEventListener("blur", commit);
}

/* ---- add form ---- */
document.getElementById("addToggleBtn").addEventListener("click", () => {
  const form = document.getElementById("addForm");
  form.classList.toggle("open");
  if (form.classList.contains("open")) {
    const dateInput = document.getElementById("addDate");
    if (state.level === "day" && state.day) dateInput.value = state.day;
    else dateInput.value = todayStr();
  }
});
document.getElementById("addSubmit").addEventListener("click", () => {
  const title = document.getElementById("addTitle").value.trim();
  const date = document.getElementById("addDate").value;
  const time = document.getElementById("addTime").value;
  if (!title || !date) return;
  const evs = getEvents();
  evs.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), title, date, time, createdAt: Date.now() });
  setEvents(evs);
  document.getElementById("addTitle").value = "";
  document.getElementById("addTime").value = "";
  document.getElementById("addForm").classList.remove("open");
  render();
});

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* ---- export / backup ----
   Reads ONLY planner-specific localStorage keys (plannerEvents,
   plannerDayMeta_*, plannerScratch_*). Does not read or touch
   webnotes_active or any other key. Read-only — nothing is
   modified or cleared by this function. */
function exportPlannerData() {
  const backup = {
    exportedAt: new Date().toISOString(),
    schemaVersion: 1,
    plannerEvents: JSON.parse(localStorage.getItem("plannerEvents") || "[]"),
    plannerDayMeta: {},
    plannerScratch: {}
  };
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key.startsWith(DAYMETA_PREFIX)) {
      backup.plannerDayMeta[key] = JSON.parse(localStorage.getItem(key));
    } else if (key.startsWith("plannerScratch_")) {
      backup.plannerScratch[key] = localStorage.getItem(key);
    }
  }
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = backup.exportedAt.replace(/[:.]/g, "-");
  a.href = url;
  a.download = `day-planner-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById("exportBtn").addEventListener("click", exportPlannerData);

/* ---- boot ---- */
render();
</script>
