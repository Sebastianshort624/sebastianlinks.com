<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación — Linx Legal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #fff; overflow: hidden; background: #0d1526; }
  /* ---------- watercolor montage background — FULL BLEED (Sebastian,
     2026-11-23): the rolling montage IS the stage. No card/page covers it;
     the words sit directly on the background. Readability comes ONLY from
     this soft full-frame scrim + text shadows, never from a boxed page. */
  #bg { position: fixed; inset: 0; z-index: 0; }
  .bglayer { position: absolute; inset: -4%; background-size: cover; background-position: center;
    filter: saturate(1.55) contrast(1.06) brightness(1.03) blur(1px);
    opacity: 0; transition: opacity 2.4s ease; animation: kenburns 26s ease-in-out infinite alternate; }
  .bglayer.on { opacity: 1; }
  @keyframes kenburns { from { transform: scale(1) translate(0,0); } to { transform: scale(1.13) translate(-1.5%, 1.5%); } }
  #veil { position: fixed; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(9,17,34,.46), rgba(9,17,34,.34) 38%, rgba(9,17,34,.40) 62%, rgba(9,17,34,.58)); }
  /* ---------- header ---------- */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; }
  header .brand { font-weight: 700; letter-spacing: 2.5px; font-size: 13px; color: #fff; text-transform: uppercase; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
  header select { font-family: inherit; font-size: 14px; padding: 5px 8px; border-radius: 8px; border: 1px solid #b9c2d0; background: rgba(255,255,255,.9); max-width: 46vw; }
  header .spacer { flex: 1; }
  .langbtn { font-family: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #0b3d91; background: rgba(255,255,255,.9); color: #0b3d91; cursor: pointer; }
  .langbtn.act { background: #0b3d91; color: #fff; }
  /* ---------- stage ---------- */
  #stage { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 64px 18px 108px; }
  /* NO CARD (Sebastian, 2026-11-23): .card is now just a transparent text
     column — no background, no box, no shadow. The words live on the video. */
  .card { background: transparent; box-shadow: none;
    max-width: 880px; width: 100%; max-height: 100%; overflow-y: auto; padding: 34px 42px 28px; text-align: center;
    animation: slidein .45s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .sec { font-size: 12.5px; font-weight: 700; letter-spacing: 3px; color: #ffd968; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .ref { font-size: 12px; color: rgba(255,255,255,.8); letter-spacing: 1.5px; margin-bottom: 16px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .txt { font-size: clamp(20px, 3.1vw, 29px); line-height: 1.5; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  /* HIGHLIGHT RULE (Sebastian, 2026-11-23): every word of the slide is in the
     DOM from the moment the slide appears and NEVER changes — the highlight
     below only restyles (dimmed white → bold yellow highlight). No words are
     ever revealed, hidden, added or removed as the highlight moves. */
  .txt .sent { transition: background .3s, color .3s; border-radius: 6px; padding: 0 3px; }
  body.auto .txt .sent { color: rgba(255,255,255,.6); }
  body.auto .txt .sent.cur { color: #14213d; background: #ffe45e; font-weight: 700; text-shadow: none; }
  body.auto .txt .sent.done { color: rgba(255,255,255,.95); }
  .qtxt { font-size: clamp(21px, 3.3vw, 31px); line-height: 1.5; font-weight: 700; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  .noans { margin-top: 20px; font-size: clamp(19px, 2.6vw, 25px); color: rgba(255,255,255,.88); font-style: italic; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .perf { margin-top: 6px; font-size: clamp(19px, 2.6vw, 25px); color: #ffd968; font-weight: 700; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  body.auto .noans, body.auto .perf { opacity: .62; }
  body.auto .noans.cur, body.auto .perf.cur { opacity: 1; background: #ffe45e; color: #14213d; text-shadow: none; border-radius: 6px; }
  .bwimg { margin: 22px auto 4px; display: block; width: min(430px, 80%); height: 190px; object-fit: cover;
    border-radius: 10px; filter: grayscale(1) contrast(1.06); box-shadow: 0 8px 24px rgba(0,0,0,.18); border: 6px solid #fff; }
  .titlecard h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.2; color: #fff; margin: 8px 0 10px; text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.7); }
  .titlecard .sub { font-size: clamp(17px, 2.6vw, 23px); color: rgba(255,255,255,.92); text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .titlecard .rule { width: 74px; height: 3px; background: #ffd968; margin: 20px auto; border-radius: 2px; }
  .breakcard .bigsec { font-size: clamp(26px, 4.6vw, 44px); color: #fff; line-height: 1.25; text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.7); }
  /* ---------- panels — translucent dark glass over the video (not a page):
     the numbers float on the background like the words do ---------- */
  .panel { margin: 24px auto 6px; max-width: 620px; text-align: left; background: rgba(8,17,36,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 12px; padding: 16px 20px; color: #fff; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .panel h3 { text-align: center; font-size: 13px; letter-spacing: 2.5px; color: #ffd968; text-transform: uppercase; margin-bottom: 10px; }
  .panel table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 2.2vw, 19px); }
  .panel td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.22); }
  .panel td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
  .panel tr:last-child td { border-bottom: none; }
  .panel .tot td { border-top: 2px solid #ffd968; font-weight: 700; }
  .pricepanel { background: rgba(11,61,145,.82); border-color: rgba(255,255,255,.35); color: #fff; text-align: center; }
  .pricepanel h3 { color: #ffd968; }
  .pricepanel .amt { font-size: clamp(30px, 5vw, 46px); font-weight: 900; line-height: 1.15; }
  .pricepanel .lbl { font-size: 12.5px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .85; }
  .pricepanel .row2 { display: flex; gap: 12px; margin-top: 12px; }
  .pricepanel .row2 > div { flex: 1; background: rgba(255,255,255,.1); border-radius: 10px; padding: 10px 6px; }
  .pricestrip { text-align: center; font-size: clamp(15px, 2.2vw, 19px); }
  .pricestrip b { color: #ffd968; }
  /* ---------- controls ---------- */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px 14px;
    background: linear-gradient(180deg, rgba(8,15,30,0), rgba(8,15,30,.55) 30%); }
  #progwrap { height: 5px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  #prog { height: 100%; width: 0; background: #ffd968; border-radius: 3px; transition: width .3s; }
  .ctlrow { display: flex; align-items: center; gap: 10px; }
  .cbtn { font-family: inherit; font-size: 17px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #0b3d91;
    background: #fff; color: #0b3d91; cursor: pointer; line-height: 1; }
  .cbtn.main { background: #0b3d91; color: #fff; }
  #modebtn { font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 11px 16px; border-radius: 999px;
    border: 1px solid #b8860b; background: #fff8e1; color: #7a5b00; cursor: pointer; letter-spacing: .6px; }
  #counter { font-size: 13.5px; color: rgba(255,255,255,.88); letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #secname { font-size: 13.5px; color: #ffd968; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 9; background: #14213d; color: #fff;
    padding: 11px 18px; border-radius: 10px; font-size: 14.5px; max-width: 86vw; text-align: center; display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .notice { font-size: clamp(18px, 2.8vw, 24px); line-height: 1.5; color: rgba(255,255,255,.94); text-shadow: 0 1px 8px rgba(0,0,0,.65); }
</style>
</head>
<body>
<div id="bg"><div class="bglayer" id="bg1"></div><div class="bglayer" id="bg2"></div></div>
<div id="veil"></div>

<header>
  <div class="brand">Linx Legal</div>
  <select id="clientsel" title="Cliente"></select>
  <div class="spacer"></div>
  <button class="langbtn act" id="btnEs">Esp</button>
  <button class="langbtn" id="btnEn">Eng</button>
</header>

<div id="stage"></div>
<div id="toast"></div>

<div id="controls">
  <div id="progwrap"><div id="prog"></div></div>
  <div class="ctlrow">
    <button class="cbtn" id="prev" title="Atrás">⏮</button>
    <button class="cbtn main" id="play" title="Pausar / continuar">⏸</button>
    <button class="cbtn" id="next" title="Adelante">⏭</button>
    <button id="modebtn">AUTOSCROLL: ON</button>
    <div id="counter"></div>
    <div class="spacer" style="flex:1"></div>
    <div id="secname"></div>
  </div>
</div>

<script src="clients.js"></script>
<script src="deck-es-mtg.js"></script>
<script src="deck-en-mtg.js"></script>
<script>
'use strict';
/* ================= MATH PORT — copied from the case file's locked TRUE COST
   model (script/index.html): mfTot escalation series, AMORTFIRST months
   remaining, win() ladder, 47% price suggestion. ================= */
/* MATH-PORT-START */
function mfTot(mf, r, n){
  if (n <= 0) return 0;
  var s = 0, full = Math.floor(n);
  for (var k = 0; k < full; k++) s += Math.round(mf * Math.pow(1 + r, k) * 100) / 100;
  var frac = n - full;
  if (frac > 0) s += mf * Math.pow(1 + r, full) * frac;
  return Math.round(s * 100) / 100;
}
function fmtC(v){ return '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtD(v){ return '$' + Math.round(v).toLocaleString('en-US'); }
function deriveClient(c){
  if (!c || c.dtype !== 'MTG') return null;
  var mmo = +c.mmo || 0, mf = +c.mf || 0, payoff = +c.payoff || 0,
      apr = +c.apr || 0, term = +c.term || 120, esc = (+c.esc || 8) / 100,
      fee = +c.fee || 0;
  if (mmo <= 0 || payoff <= 0 || apr <= 0) return null;
  var r = apr / 100 / 12;
  if (mmo <= payoff * r) return null;
  var mrem = Math.ceil(-Math.log(1 - payoff * r / mmo) / Math.log(1 + r));
  function win(y){ return Math.round((mmo * Math.min(y * 12, mrem) + mfTot(mf, esc, y)) * 100) / 100; }
  var t3 = win(3), t5 = win(5), t10 = win(10), t20 = win(20);
  var loan = mmo * (1 - Math.pow(1 + r, -term)) / r;
  var sched = mmo * term;
  var intpct = (sched - loan) / loan * 100;
  var price;
  if (fee > 0) price = fee;
  else { var s47 = Math.max(payoff * 0.47, 3500); price = s47 + (s47 < 10000 ? 299 : 399); }
  var mfmo = Math.floor(mf / 12);
  return { mrem: mrem, t3: t3, t5: t5, t10: t10, t20: t20,
    loan: Math.round(loan * 100) / 100, sched: Math.round(sched * 100) / 100,
    intpct: Math.round(intpct * 10) / 10, price: Math.round(price * 100) / 100,
    save20: Math.round((t20 - price) * 100) / 100, mfmo: mfmo,
    totmo: Math.round((mmo + mfmo) * 100) / 100, totyr: Math.round((mmo * 12 + mf) * 100) / 100,
    f: { payoff: fmtC(payoff), mmo: fmtC(mmo), mfyr: fmtC(mf), mfmo: fmtD(mfmo),
         totmo: fmtC(mmo + mfmo), totyr: fmtC(mmo * 12 + mf), t3: fmtC(t3), t5: fmtC(t5),
         t10: fmtC(t10), t20: fmtC(t20), loan: fmtC(loan), sched: fmtC(sched),
         price: fmtD(price), save20: fmtC(t20 - price) } };
}
/* MATH-PORT-END */

/* ================= engine ================= */
var $ = function(id){ return document.getElementById(id); };
var params = new URLSearchParams(location.search);
var CLIENTS = window.DECK_CLIENTS || {};
var DECKS = { es: window.DECK_TEXT_ES_MTG || null, en: window.DECK_TEXT_EN_MTG || null };
var lang = (params.get('lang') === 'en' && DECKS.en) ? 'en' : 'es';
var DECK = DECKS[lang];
var clientId = params.get('c') || 'c-balderas-1122';
if (!CLIENTS[clientId]) clientId = Object.keys(CLIENTS)[0];
var client = null, derived = null, slides = [], idx = 0;
var auto = true, playing = true, elapsed = 0, lastTick = null, rafId = null;

/* UI + panel labels per language (deck text itself lives in the data files) */
var L = {
  es: { pres: 'Presentación', prepFor: 'Preparada para ', titleSub: 'La cancelación completa y legítima de su tiempo compartido',
        cont: 'Continuamos', qref: 'PREGUNTA · ', caDef: 'nuestro analista de casos', resortDef: 'su resort',
        confirmT: 'Sus números — confirmados', pyr: 'Año de compra', payoff: 'Saldo (payoff)', mmo: 'Cuota de hipoteca/mes',
        mf: 'Mantenimiento/mes · /año', total: 'Total/mes · /año', perMo: ' / mes', perYr: ' / año',
        buT: 'Su costo verdadero — desde hoy', yrs: ['3 años', '5 años', '10 años', '20 años'],
        inv: 'Inversión total', save: 'Ahorro a 20 años', stay: 'Costo de quedarse · 20 años',
        noteInv: 'Inversión total: ', noteSave: ' · Ahorro a 20 años: ' },
  en: { pres: 'Presentation', prepFor: 'Prepared for ', titleSub: 'The complete and legitimate cancellation of your timeshare',
        cont: 'Continuing', qref: 'QUESTION · ', caDef: 'our case analyst', resortDef: 'your resort',
        confirmT: 'Your numbers — confirmed', pyr: 'Purchase year', payoff: 'Payoff', mmo: 'Mortgage payment/mo',
        mf: 'Maintenance/mo · /yr', total: 'Total/mo · /yr', perMo: ' / mo', perYr: ' / yr',
        buT: 'Your true cost — from today', yrs: ['3 years', '5 years', '10 years', '20 years'],
        inv: 'TOTAL INVESTMENT', save: 'TOTAL SAVINGS', stay: 'Cost of staying · 20 years',
        noteInv: 'Total investment: ', noteSave: ' · Total savings: ' }
};
function tokens(){
  var d = derived, f = d ? d.f : null;
  var miss = '$X';
  var names = client.firstNames || client.name;
  if (lang === 'en' && names) names = names.replace(/ y /g, ' and ');
  return {
    '{{NAMES}}': names,
    '{{RESORT}}': client.resortShort || L[lang].resortDef,
    '{{CA}}': client.caFirst || L[lang].caDef,
    '{{PYR}}': client.pyr || '—',
    '{{TERM}}': client.term || 120,
    '{{PAYOFF}}': f ? f.payoff : miss, '{{MMO}}': f ? f.mmo : miss,
    '{{MFYR}}': f ? f.mfyr : miss, '{{MFMO}}': f ? f.mfmo : miss,
    '{{TOTMO}}': f ? f.totmo : miss, '{{TOTYR}}': f ? f.totyr : miss,
    '{{T3}}': f ? f.t3 : miss, '{{T5}}': f ? f.t5 : miss,
    '{{T10}}': f ? f.t10 : miss, '{{T20}}': f ? f.t20 : miss,
    '{{LOAN}}': f ? f.loan : miss, '{{SCHED}}': f ? f.sched : miss,
    '{{INTPCT}}': d ? Math.floor(d.intpct) : '100',
    '{{PRICE}}': f ? f.price : miss, '{{SAVE20}}': f ? f.save20 : miss
  };
}
function fill(text){
  var map = tokens();
  return String(text).replace(/\{\{[A-Z0-9]+\}\}/g, function(t){ return map[t] != null ? map[t] : t; });
}
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function panelHTML(kind){
  var d = derived, f = d ? d.f : null;
  var t = L[lang];
  if (!f) return '';
  if (kind === 'confirm'){
    return '<div class="panel"><h3>' + t.confirmT + '</h3><table>' +
      '<tr><td>' + t.pyr + '</td><td>' + esc(client.pyr || '—') + '</td></tr>' +
      '<tr><td>' + t.payoff + '</td><td>' + f.payoff + '</td></tr>' +
      '<tr><td>' + t.mmo + '</td><td>' + f.mmo + '</td></tr>' +
      '<tr><td>' + t.mf + '</td><td>' + f.mfmo + ' · ' + f.mfyr + '</td></tr>' +
      '<tr class="tot"><td>' + t.total + '</td><td>' + f.totmo + ' · ' + f.totyr + '</td></tr>' +
      '</table></div>';
  }
  if (kind === 'buildup'){
    return '<div class="panel"><h3>' + t.buT + '</h3><table>' +
      '<tr><td>' + t.yrs[0] + '</td><td>' + f.t3 + '</td></tr>' +
      '<tr><td>' + t.yrs[1] + '</td><td>' + f.t5 + '</td></tr>' +
      '<tr><td>' + t.yrs[2] + '</td><td>' + f.t10 + '</td></tr>' +
      '<tr class="tot"><td>' + t.yrs[3] + '</td><td>' + f.t20 + '</td></tr></table></div>';
  }
  if (kind === 'price'){
    return '<div class="panel pricepanel"><div class="lbl">' + t.inv + '</div>' +
      '<div class="amt">' + f.price + '</div>' +
      '<div class="row2"><div><div class="lbl">' + t.save + '</div><div style="font-size:22px;font-weight:800">' + f.save20 + '</div></div>' +
      '<div><div class="lbl">' + t.stay + '</div><div style="font-size:22px;font-weight:800">' + f.t20 + '</div></div></div></div>';
  }
  if (kind === 'pricenote'){
    return '<div class="panel pricestrip">' + t.noteInv + '<b>' + f.price + '</b>' + t.noteSave + '<b>' + f.save20 + '</b></div>';
  }
  return '';
}

function render(){
  var sl = slides[idx];
  var stage = $('stage');
  var html = '';
  if (sl.kind === 'title'){
    html = '<div class="card titlecard"><div class="sec">' + L[lang].pres + '</div>' +
      '<h1>' + esc(fill(L[lang].prepFor + '{{NAMES}}')) + '</h1>' +
      '<div class="sub">' + esc(client.resort || '') + '</div><div class="rule"></div>' +
      '<div class="sub">' + L[lang].titleSub + '</div></div>';
  } else if (sl.kind === 'break'){
    html = '<div class="card breakcard"><div class="sec">' + L[lang].cont + '</div>' +
      '<div class="bigsec">' + esc(sl.sec) + '</div>' +
      '<img class="bwimg" src="https://picsum.photos/id/' + sl.img + '/900/420?grayscale" alt="">' + '</div>';
  } else if (sl.kind === 'question'){
    var q = sl.sentences[0], no = sl.sentences[1], pf = sl.sentences[2];
    html = '<div class="card"><div class="sec">' + esc(sl.sec) + '</div>' +
      '<div class="ref">' + L[lang].qref + (idx + 1) + ' / ' + slides.length + '</div>' +
      '<div class="qtxt sent" data-s="' + q.s + '" data-d="' + q.d + '">' + esc(fill(q.x)) + '</div>' +
      '<div class="noans" data-s="' + no.s + '" data-d="' + no.d + '">' + esc(fill(no.x)) + '</div>' +
      '<div class="perf" data-s="' + pf.s + '" data-d="' + pf.d + '">' + esc(fill(pf.x)) + '</div>' +
      '<img class="bwimg" src="https://picsum.photos/id/' + sl.img + '/900/420?grayscale" alt=""></div>';
  } else {
    var sents = sl.sentences.map(function(s){
      return '<span class="sent" data-s="' + s.s + '" data-d="' + s.d + '">' + esc(fill(s.x)) + '</span>';
    }).join(' ');
    html = '<div class="card"><div class="sec">' + esc(sl.sec) + '</div>' +
      '<div class="ref">' + (idx + 1) + ' / ' + slides.length + '</div>' +
      '<div class="txt">' + sents + '</div>' + panelHTML(sl.panel) +
      '<img class="bwimg" src="https://picsum.photos/id/' + sl.img + '/900/420?grayscale" alt=""></div>';
  }
  stage.innerHTML = html;
  $('counter').textContent = (idx + 1) + ' / ' + slides.length;
  $('secname').textContent = sl.sec || '';
  $('prog').style.width = ((idx + 1) / slides.length * 100) + '%';
  elapsed = 0; lastTick = null;
  markCurrent();
}
function markCurrent(){
  if (!auto) return;
  var sl = slides[idx];
  var t = sl.start + elapsed;
  document.querySelectorAll('[data-s]').forEach(function(el){
    var s = parseFloat(el.getAttribute('data-s')), d = parseFloat(el.getAttribute('data-d'));
    el.classList.toggle('cur', t >= s && t < s + d);
    el.classList.toggle('done', t >= s + d);
  });
}
function tick(now){
  if (!auto || !playing){ rafId = null; return; }
  if (lastTick == null) lastTick = now;
  elapsed += (now - lastTick) / 1000;
  lastTick = now;
  var sl = slides[idx];
  if (elapsed >= sl.dur){
    if (idx < slides.length - 1){ idx++; render(); }
    else { playing = false; $('play').textContent = '▶'; rafId = null; return; }
  } else markCurrent();
  rafId = requestAnimationFrame(tick);
}
function startTimer(){
  if (rafId == null && auto && playing) rafId = requestAnimationFrame(tick);
}
function go(n){
  idx = Math.max(0, Math.min(slides.length - 1, n));
  render(); startTimer();
}
function setAuto(on){
  auto = on;
  document.body.classList.toggle('auto', auto);
  $('modebtn').textContent = auto ? 'AUTOSCROLL: ON' : 'MANUAL';
  if (auto){ playing = true; $('play').textContent = '⏸'; startTimer(); }
  else { markClear(); }
}
function markClear(){
  document.querySelectorAll('[data-s]').forEach(function(el){ el.classList.remove('cur', 'done'); });
}
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 4200);
}

/* background montage — watercolor-filtered stills, slow Ken Burns crossfade
   (Spanish deck: Latin landscapes/cities; English deck pool swaps with its
   text data file when it lands) */
var BG = [1015, 1016, 1018, 1029, 1036, 1039, 1047, 1048, 1050, 164, 183, 1067];
var bgIdx = 0, bgFlip = false;
function cycleBg(){
  var a = $(bgFlip ? 'bg1' : 'bg2'), b = $(bgFlip ? 'bg2' : 'bg1');
  a.style.backgroundImage = 'url(https://picsum.photos/id/' + BG[bgIdx % BG.length] + '/1600/1000)';
  a.classList.add('on'); b.classList.remove('on');
  bgFlip = !bgFlip; bgIdx++;
}
cycleBg(); setInterval(cycleBg, 9000);

/* client select */
var sel = $('clientsel');
Object.keys(CLIENTS).forEach(function(id){
  var o = document.createElement('option');
  o.value = id; o.textContent = CLIENTS[id].name + ' · ' + (CLIENTS[id].dtype || '');
  if (id === clientId) o.selected = true;
  sel.appendChild(o);
});
sel.addEventListener('change', function(){
  var url = new URL(location.href);
  url.searchParams.set('c', sel.value);
  location.href = url.toString();
});

/* controls */
$('next').addEventListener('click', function(){ go(idx + 1); });
$('prev').addEventListener('click', function(){ go(idx - 1); });
$('play').addEventListener('click', function(){
  if (!auto){ setAuto(true); return; }
  playing = !playing;
  $('play').textContent = playing ? '⏸' : '▶';
  if (playing) startTimer();
});
$('modebtn').addEventListener('click', function(){ setAuto(!auto); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.key === ' '){ e.preventDefault(); $('play').click(); }
});
/* language toggle — switches decks BOTH ways, at any slide, landing on the
   corresponding slide (same index; the two decks are slide-for-slide) */
function setLang(nl){
  if (nl === lang || !DECKS[nl]) return;
  lang = nl; DECK = DECKS[nl];
  document.documentElement.lang = nl;
  $('btnEs').classList.toggle('act', nl === 'es');
  $('btnEn').classList.toggle('act', nl === 'en');
  if (client.dtype === 'DB'){ renderDbNotice(); return; }
  slides = DECK.slides;
  idx = Math.max(0, Math.min(slides.length - 1, idx));
  render(); startTimer();
}
$('btnEn').addEventListener('click', function(){ setLang('en'); });
$('btnEs').addEventListener('click', function(){ setLang('es'); });

function renderDbNotice(){
  $('stage').innerHTML = '<div class="card"><div class="sec">Deed-back</div>' +
    '<div class="notice">Este cliente es <b>deed-back</b>. El show de deed-back usa este mismo motor ' +
    '(historia de mantenimiento y lista, sin hipoteca) — su archivo de datos es la variante pendiente.<br><br>' +
    esc(client.name) + ' · ' + esc(client.resort || '') + '</div></div>';
  $('counter').textContent = 'DB';
}

/* boot */
client = CLIENTS[clientId];
derived = client.derived || deriveClient(client);
document.documentElement.lang = lang;
$('btnEs').classList.toggle('act', lang === 'es');
$('btnEn').classList.toggle('act', lang === 'en');
if (client.dtype === 'DB'){
  renderDbNotice();
} else if (!DECK){
  $('stage').innerHTML = '<div class="card"><div class="notice">Deck data missing.</div></div>';
} else {
  slides = DECK.slides;
  document.body.classList.add('auto');
  render(); startTimer();
}
</script>
</body>
</html>
