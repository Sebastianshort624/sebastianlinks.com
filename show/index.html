<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación — Linx Legal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #fff; overflow: hidden; background: #0d1526; }
  /* ---------- watercolor montage background — FULL BLEED (Sebastian,
     2026-11-23): the rolling montage IS the stage. No card/page covers it;
     the words sit directly on the background. Readability comes ONLY from
     this soft full-frame scrim + text shadows, never from a boxed page. */
  #bg { position: fixed; inset: 0; z-index: 0; }
  .bglayer { position: absolute; inset: -4%; background-size: cover; background-position: center;
    filter: saturate(1.55) contrast(1.06) brightness(1.03) blur(1px);
    opacity: 0; transition: opacity 2.4s ease; animation: kenburns 26s ease-in-out infinite alternate; }
  .bglayer.on { opacity: 1; }
  @keyframes kenburns { from { transform: scale(1) translate(0,0); } to { transform: scale(1.13) translate(-1.5%, 1.5%); } }
  /* ---------- background VIDEO (Sebastian, 2026-11-23): the rolling
     watercolor montage from the downloaded karaoke video, as a real
     <video> layer over the photo layers. It fades in only once it can
     actually play ('on'); if it errors or never starts, it hides and
     the folk-photo rotation underneath carries on untouched. The veil
     scrim above it is unchanged. */
  #bgvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(1.55) contrast(1.06) brightness(1.03) blur(1px);
    opacity: 0; transition: opacity 1.6s ease; }
  #bgvid.on { opacity: 1; }
  #veil { position: fixed; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(9,17,34,.46), rgba(9,17,34,.34) 38%, rgba(9,17,34,.40) 62%, rgba(9,17,34,.58)); }
  /* ---------- header ---------- */
  header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; }
  header .brand { font-weight: 700; letter-spacing: 2.5px; font-size: 13px; color: #fff; text-transform: uppercase; text-shadow: 0 1px 10px rgba(0,0,0,.6); }
  header select { font-family: inherit; font-size: 14px; padding: 5px 8px; border-radius: 8px; border: 1px solid #b9c2d0; background: rgba(255,255,255,.9); max-width: 46vw; }
  header .spacer { flex: 1; }
  .langbtn { font-family: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
    border: 1px solid #0b3d91; background: rgba(255,255,255,.9); color: #0b3d91; cursor: pointer; }
  .langbtn.act { background: #0b3d91; color: #fff; }
  /* ---------- stage ---------- */
  #stage { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; padding: 64px 18px 108px; }
  /* NO CARD (Sebastian, 2026-11-23): .card is now just a transparent text
     column — no background, no box, no shadow. The words live on the video. */
  .card { background: transparent; box-shadow: none;
    max-width: 880px; width: 100%; max-height: 100%; overflow-y: auto; padding: 34px 42px 28px; text-align: center;
    animation: slidein .45s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .sec { font-size: 12.5px; font-weight: 700; letter-spacing: 3px; color: #ffd968; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .ref { font-size: 12px; color: rgba(255,255,255,.8); letter-spacing: 1.5px; margin-bottom: 16px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .txt { font-size: clamp(22.7px, 3.4vw, 31.7px); line-height: 1.5; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  /* HIGHLIGHT RULE (Sebastian, 2026-11-23): every word of the slide is in the
     DOM from the moment the slide appears and NEVER changes — the highlight
     below only restyles (dimmed white → bold fluorescent-green highlight).
     No words are ever revealed, hidden, added or removed as the highlight
     moves.
     HIGHLIGHT GRANULARITY (Sebastian, 2026-11-24 — supersedes the
     2026-11-23 4-6-word rule): the highlight moves in HALVES of the
     slide's text (.w spans) — the first half is lit, then the second
     half: exactly 2 steps per slide. Longer highlights are better.
     Same styling in MANUAL: the current half stays highlighted while
     every word remains visible.
     HIGHLIGHT COLOR (Sebastian, 2026-11-24): FLUORESCENT GREEN — the
     lit half is #39FF14 text on a translucent rgba(57,255,20,.20)
     wash, bold, same restyle behavior. */
  .txt .w { transition: background .3s, color .3s; border-radius: 6px; padding: 0 2px; color: rgba(255,255,255,.6); }
  .txt .w.cur { color: #39FF14; background: rgba(57,255,20,.20); font-weight: 700; text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  .txt .w.done { color: rgba(255,255,255,.95); }
  .qtxt { font-size: clamp(23.7px, 3.6vw, 33.7px); line-height: 1.5; font-weight: 700; color: #fff;
    text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  .noans { margin-top: 20px; font-size: clamp(21.7px, 2.9vw, 27.7px); color: rgba(255,255,255,.88); font-style: italic; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .perf { margin-top: 6px; font-size: clamp(21.7px, 2.9vw, 27.7px); color: #ffd968; font-weight: 700; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  body.auto .noans, body.auto .perf { opacity: .62; }
  .noans.cur, .perf.cur { opacity: 1; background: rgba(57,255,20,.20); color: #39FF14; text-shadow: 0 1px 8px rgba(0,0,0,.65); border-radius: 6px; }
  .qtxt.cur { background: rgba(57,255,20,.20); color: #39FF14; text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); border-radius: 6px; }
  /* NO HIGHLIGHT FOR ENGLISH (Sebastian, 2026-11-25 — "lets try english
     without the highlight as you go"): with body.nohl every word sits at
     full white from the start; the chunk classes still toggle underneath
     but restyle nothing. Spanish keeps the fluorescent-green highlight. */
  body.nohl .txt .w, body.nohl .txt .w.cur, body.nohl .txt .w.done { color: #fff; background: none; font-weight: inherit; }
  body.nohl .qtxt.cur, body.nohl .noans.cur, body.nohl .perf.cur { background: none; color: inherit; }
  /* SECTION DRAWING (Sebastian, 2026-11-23): one classy gold-line drawing
     per section sits under the words, directly on the background — thin
     gold frame, no white card, no grayscale stock photo. */
  .drawimg { margin: 22px auto 4px; display: block; width: min(430px, 80%); height: 190px; object-fit: cover;
    border-radius: 10px; box-shadow: 0 10px 28px rgba(0,0,0,.45); border: 1px solid rgba(255,217,104,.55); }
  /* ---------- BIG MANUAL CONTROLS (Sebastian, 2026-11-23): clients
     interject and expound, so the pitch runs MANUAL — a big play/pause
     flanked by the highlight steppers sits in flow BETWEEN the words
     and the section drawing, reachable without looking down. Round
     dark-glass, gold glyphs, NO white card (steppers = DOUBLE-arrow
     slide jumps — Sebastian,
     2026-11-24: the big arrow is the double arrow so he jumps to the
     next screen faster; play = the play/pause toggle). Highlight-half
     stepping lives on the small ◀/▶ buttons and the keyboard. */
  #bigctl { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 20px auto 2px; }
  .bbtn { font-family: inherit; border-radius: 50%; border: 1px solid rgba(255,217,104,.55);
    background: rgba(8,17,36,.55); color: #ffd968; cursor: pointer; line-height: 1;
    width: 68px; height: 68px; font-size: 26px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .bbtn.main { width: 84px; height: 84px; font-size: 34px; background: rgba(11,61,145,.82); color: #fff;
    border-color: rgba(255,255,255,.5); }
  .bbtn:active { transform: scale(.94); }
  .titlecard h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.2; color: #fff; margin: 8px 0 10px; text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.7); }
  .titlecard .sub { font-size: clamp(17px, 2.6vw, 23px); color: rgba(255,255,255,.92); text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .titlecard .rule { width: 74px; height: 3px; background: #ffd968; margin: 20px auto; border-radius: 2px; }
  .breakcard .bigsec { font-size: clamp(26px, 4.6vw, 44px); color: #fff; line-height: 1.25; text-shadow: 0 2px 18px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.7); }
  /* STOPCARD_V1 (Sebastian, 2026-11-23): post-price silence slide — red octagon stop sign */
  .stopcard .stopsign { width: clamp(128px, 24vw, 200px); height: clamp(128px, 24vw, 200px); margin: 12px auto 10px;
    background: #c0272d; clip-path: polygon(29% 0%, 71% 0%, 100% 29%, 100% 71%, 71% 100%, 29% 100%, 0% 71%, 0% 29%);
    display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 26px rgba(0,0,0,.55)); }
  .stopcard .stopsign span { color: #fff; font-weight: 900; letter-spacing: .14em; font-size: clamp(24px, 4.2vw, 40px);
    border: 3px solid #fff; border-radius: 8px; padding: 3px 12px 5px; }
  .stopcard .stopnote { color: #fff; font-size: clamp(16px, 2.6vw, 23px); line-height: 1.45; max-width: 660px; margin: 10px auto 0;
    text-shadow: 0 2px 14px rgba(0,0,0,.65), 0 1px 4px rgba(0,0,0,.7); }
  /* ---------- panels — translucent dark glass over the video (not a page):
     the numbers float on the background like the words do ---------- */
  .panel { margin: 24px auto 6px; max-width: 620px; text-align: left; background: rgba(8,17,36,.55); border: 1px solid rgba(255,255,255,.35);
    border-radius: 12px; padding: 16px 20px; color: #fff; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .panel h3 { text-align: center; font-size: 13px; letter-spacing: 2.5px; color: #ffd968; text-transform: uppercase; margin-bottom: 10px; }
  .panel table { width: 100%; border-collapse: collapse; font-size: clamp(15px, 2.2vw, 19px); }
  .panel td { padding: 5px 4px; border-bottom: 1px solid rgba(255,255,255,.22); }
  .panel td:last-child { text-align: right; font-weight: 700; white-space: nowrap; }
  .panel tr:last-child td { border-bottom: none; }
  .panel .tot td { border-top: 2px solid #ffd968; font-weight: 700; }
  .pricepanel { background: rgba(11,61,145,.82); border-color: rgba(255,255,255,.35); color: #fff; text-align: center; }
  .pricepanel h3 { color: #ffd968; }
  .pricepanel .amt { font-size: clamp(30px, 5vw, 46px); font-weight: 900; line-height: 1.15; }
  .pricepanel .lbl { font-size: 12.5px; letter-spacing: 2.5px; text-transform: uppercase; opacity: .85; }
  .pricepanel .row2 { display: flex; gap: 12px; margin-top: 12px; }
  .pricepanel .row2 > div { flex: 1; background: rgba(255,255,255,.1); border-radius: 10px; padding: 10px 6px; }
  .pricestrip { text-align: center; font-size: clamp(15px, 2.2vw, 19px); }
  .pricestrip b { color: #ffd968; }
  /* ---------- side rail (Sebastian, 2026-11-23): the client's key data,
     always on screen on the RIGHT of the stage, values editable in
     place — dark glass like the panels, gold labels, NO white card.
     Under 900px it collapses to a slim toggleable strip. ---------- */
  body.rail-on #stage { padding-right: 316px; }
  #rail { position: fixed; top: 60px; right: 14px; bottom: 148px; width: 276px; z-index: 4;
    background: rgba(8,17,36,.55); border: 1px solid rgba(255,255,255,.35); border-radius: 12px;
    padding: 14px 16px; color: #fff; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    text-shadow: 0 1px 5px rgba(0,0,0,.55); overflow-y: auto; }
  #railtoggle { display: none; }
  /* Sebastian 2026-11-23 22:41: the numbers in the video's data menu (this
     rail) are BIG — this is where his font-enlargement order belonged; it was
     misapplied to the case file earlier tonight and reverted there. */
  .rname { font-size: 20px; font-weight: 700; line-height: 1.25; }
  .rresort { font-size: 15px; color: rgba(255,255,255,.85); margin: 2px 0 4px; }
  .rsec { font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: #ffd968; text-transform: uppercase;
    border-top: 1px solid rgba(255,255,255,.22); padding-top: 10px; margin: 8px 0 6px; }
  .rrow { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.14); }
  .rlab2 { font-size: 15px; color: #ffd968; letter-spacing: .4px; }
  .rval { font-size: 19px; font-weight: 700; text-align: right; white-space: nowrap; }
  .rval.ed { cursor: pointer; border-bottom: 1px dashed rgba(255,217,104,.55); }
  .rval.ed:hover { color: #ffe45e; }
  .rval.warn { color: #ff9d7a; }
  .redit { width: 130px; font-family: inherit; font-size: 18px; font-weight: 700; text-align: right;
    background: rgba(255,255,255,.92); color: #14213d; border: 1px solid #ffd968; border-radius: 6px; padding: 2px 6px; }
  .rreset { margin-top: 12px; font-size: 12.5px; color: #ffd968; cursor: pointer; text-align: right; }
  .rreset:hover { text-decoration: underline; }
  @media (max-width: 900px){
    body.rail-on #stage { padding-right: 18px; }
    #rail { width: 38px; padding: 8px 3px; overflow: visible; }
    #railbody { display: none; }
    #railtoggle { display: block; width: 100%; font-family: inherit; font-size: 16px; padding: 6px 0;
      border-radius: 8px; border: 1px solid rgba(255,217,104,.55); background: rgba(8,17,36,.55); color: #ffd968; cursor: pointer; }
    #rail.open { width: min(262px, 84vw); padding: 14px 16px; overflow-y: auto; }
    #rail.open #railbody { display: block; }
    #rail.open #railtoggle { margin-bottom: 10px; }
  }
  /* ---------- controls ---------- */
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px 14px;
    background: linear-gradient(180deg, rgba(8,15,30,0), rgba(8,15,30,.55) 30%); }
  /* ---------- chapter ruler (Sebastian, 2026-11-23): section ticks +
     labels above the progress bar, positioned by first-slide index like
     ruler markings (two staggered rows, long names shortened); the
     ruler + bar are one padded click target — click anywhere to jump
     to that point of the deck, click a label for its section start -- */
  #seekzone { cursor: pointer; padding: 14px 0 2px; }
  /* ruler spacing opened up (Sebastian, 2026-11-23): the two label rows
     were crunched on top of each other — taller zone, upper row raised,
     clear air between the rows and between labels and the bar */
  #ruler { position: relative; height: 66px; }
  .rtick { position: absolute; bottom: 0; width: 2px; height: 8px; margin-left: -1px; background: rgba(255,217,104,.55); border-radius: 1px; }
  .rtick.cur { background: #ffe45e; height: 12px; }
  .rlab { position: absolute; transform: translateX(-50%); font-family: inherit; font-size: 10.5px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; max-width: 132px; overflow: hidden;
    text-overflow: ellipsis; padding: 2px 7px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,217,104,.4); background: rgba(8,17,36,.55); color: #ffd968;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .rdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; } /* RULERDOTS_20261125 */
  .rlab.row0 { bottom: 16px; }
  .rlab.row1 { bottom: 43px; }
  .rlab.cur { background: rgba(255,217,104,.3); color: #fff; border-color: #ffd968; z-index: 3; }
  #progwrap { height: 5px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  #prog { height: 100%; width: 0; background: #ffd968; border-radius: 3px; transition: width .3s; }
  .ctlrow { display: flex; align-items: center; gap: 10px; }
  .cbtn { font-family: inherit; font-size: 17px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #0b3d91;
    background: #fff; color: #0b3d91; cursor: pointer; line-height: 1; }
  .cbtn.main { background: #0b3d91; color: #fff; }
  #modebtn { font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 11px 16px; border-radius: 999px;
    border: 1px solid #b8860b; background: #fff8e1; color: #7a5b00; cursor: pointer; letter-spacing: .6px; }
  /* narration mute + volume (YouTube-style, show page only) */
  #mutebtn { font-size: 19px; flex: none; }
  #volslider { width: 92px; accent-color: #ffd968; cursor: pointer; flex: none; }
  #counter { font-size: 13.5px; color: rgba(255,255,255,.88); letter-spacing: 1px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #secname { font-size: 13.5px; color: #ffd968; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 9; background: #14213d; color: #fff;
    padding: 11px 18px; border-radius: 10px; font-size: 14.5px; max-width: 86vw; text-align: center; display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,.3); }
  .notice { font-size: clamp(18px, 2.8vw, 24px); line-height: 1.5; color: rgba(255,255,255,.94); text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  /* ---------- objections menu (Sebastian, 2026-11-23): full-screen over
     the show, SAME visual language — background image + scrim, words on
     the background, translucent dark-glass rows. NO white card. Opening
     it never touches show state: slide/chunk/AUTO-MANUAL are preserved
     and the show resumes exactly where it was. ---------- */
  #objbtn { font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 11px 16px; border-radius: 999px;
    border: 1px solid #0b3d91; background: #0b3d91; color: #fff; cursor: pointer; letter-spacing: .6px; white-space: nowrap; }
  #obj { position: fixed; inset: 0; z-index: 20; display: none; }
  #obj.open { display: block; }
  #objbg { position: absolute; inset: -4%; background-size: cover; background-position: center;
    filter: saturate(1.55) contrast(1.06) brightness(1.03) blur(1px); }
  #objveil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9,17,34,.55), rgba(9,17,34,.45) 38%, rgba(9,17,34,.5) 62%, rgba(9,17,34,.66)); }
  .objwrap { position: relative; z-index: 2; height: 100%; overflow-y: auto; padding: 26px 18px 48px;
    display: flex; flex-direction: column; align-items: center; }
  .objnav { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .objnav .sp { flex: 1; }
  .objpill { font-family: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 15px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.55); background: rgba(8,17,36,.55); color: #fff; cursor: pointer;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .objtitle { width: 100%; max-width: 760px; text-align: center; font-size: 12.5px; font-weight: 700;
    letter-spacing: 3px; color: #ffd968; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .objhead { width: 100%; max-width: 760px; text-align: center; font-size: clamp(23px, 4vw, 34px); font-weight: 700;
    line-height: 1.25; color: #fff; margin-bottom: 22px; text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  .objlist { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 12px; }
  .objitem { font-family: inherit; width: 100%; text-align: left; background: rgba(8,17,36,.55);
    border: 1px solid rgba(255,255,255,.35); border-radius: 12px; padding: 16px 20px; color: #fff;
    font-size: clamp(17px, 2.6vw, 22px); line-height: 1.4; cursor: pointer;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  .objitem:hover, .objitem:active { border-color: #ffd968; }
  .objitem .cnt { float: right; color: #ffd968; font-weight: 700; }
  .objq { width: 100%; max-width: 820px; text-align: center; font-size: clamp(20px, 3.2vw, 27px); font-weight: 700;
    color: #ffd968; line-height: 1.35; margin-bottom: 18px; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  .objreb { width: 100%; max-width: 820px; text-align: center; font-size: clamp(19px, 2.9vw, 26px);
    line-height: 1.55; color: #fff; text-shadow: 0 2px 14px rgba(0,0,0,.62), 0 1px 3px rgba(0,0,0,.7); }
  /* ---------- DocuSign legend view (DOCUSIGN_LEGEND_V1, Sebastian, 2026-11-25) */
  .doctable { width: 100%; max-width: 980px; border-collapse: collapse; }
  .doctable th, .doctable td { border: 1px solid rgba(255,255,255,.28); padding: 7px 9px; vertical-align: top; font-size: 13.5px; text-align: left; color: #eef2ff; }
  .doctable th { background: rgba(11,61,145,.85); color: #fff; font-size: 12.5px; letter-spacing: .04em; }
  .doctable .dlw { font-weight: 700; white-space: nowrap; color: #ffd968; }
  .docnote { width: 100%; max-width: 980px; font-size: 13px; color: #c9d4ee; margin: 4px 0 10px; text-align: left; }
  /* ---------- reputation view (Sebastian, 2026-11-25): two groups —
     ONLINE REPUTATION (the videos, each opens in a new window) and the
     verbatim reputation SCRIPT passages. Same dark glass, no white card. */
  .repsec { width: 100%; max-width: 760px; text-align: center; font-size: 12.5px; font-weight: 700;
    letter-spacing: 3px; color: #ffd968; text-transform: uppercase; margin: 20px 0 12px;
    text-shadow: 0 1px 8px rgba(0,0,0,.65); }

    if (c5) rh += '<tr><td>' + t.rfStay + ' · ' + t.yrs[1] + '</td><td>' + c5 + '</td></tr>';
    if (c10) rh += '<tr><td>' + t.rfStay + ' · ' + t.yrs[2] + '</td><td>' + c10 + '</td></tr>';
    if (c20) rh += '<tr class="tot"><td>' + t.rfStay + ' · ' + t.yrs[3] + '</td><td>' + c20 + '</td></tr>';
    return rh + '</table></div>';
  }
  if (kind === 'paidtotal'){
    /* PAID-TOTAL PANEL (Sebastian, 2026-11-23 order; built 2026-11-24
       final pass): total paid to date = mortgage payments made +
       maintenance paid, current-year MF not counted — his paid-total
       formula, the same math as the refund panel's paid figure. The
       amount lives ONLY in this panel: the slide's sentence is a bare
       lead-in and the narration never speaks the figure. Panel slide,
       so the numbers HOLD applies like every panel slide. */
    var pnowY = new Date().getFullYear();
    var pyrs = (client.pyr > 1900) ? Math.max(0, pnowY - client.pyr) : 0;
    var pmo = (+client.mmo || 0) * Math.min(pyrs * 12, +client.term || 120);
    var pmf = (+client.mf || 0) * Math.max(0, pyrs - 1);
    var ptot = pmo + pmf;
    if (!(ptot > 0)) return '';
    var ph = '<div class="panel"><h3>' + t.ptT + '</h3><table>';
    if (pmo > 0) ph += '<tr><td>' + t.ptMo + '</td><td>' + fmtC(pmo) + '</td></tr>';
    if (pmf > 0) ph += '<tr><td>' + t.ptMf + '</td><td>' + fmtC(pmf) + '</td></tr>';
    ph += '<tr class="tot"><td>' + t.ptTot + '</td><td>' + fmtC(ptot) + '</td></tr>';
    return ph + '</table></div>';
  }
  if (kind === 'pricenote'){
    return '<div class="panel pricestrip">' + t.noteInv + '<b>' + f.price + '</b>' + t.noteSave + '<b>' + f.save20 + '</b></div>';
  }
  return '';
}

/* BIG MANUAL CONTROLS (Sebastian, 2026-11-23; NAVIGATION changed
   2026-11-24): rendered in flow between the words and the drawing on
   every slide. The BIG steppers are the DOUBLE arrows (⏮/⏭) — they
   jump between SLIDES/screens, so Sebastian reaches the next screen
   faster (the single big arrow is gone). The buttons carry no
   handlers of their own — the #stage click delegation routes them to
   go(idx − 1) / go(idx + 1) / the play toggle, the same actions the
   keyboard Shift+Arrows use. Highlight-half stepping stays on the
   small ◀/▶ buttons and the plain keyboard arrows. #bigplay's glyph
   is synced from syncModeBtn() alongside the mode button. */
var BIGCTL = '<div id="bigctl">' +
  '<button class="bbtn" id="bigprev" title="Pantalla anterior">⏮</button>' +
  '<button class="bbtn main" id="bigplay" title="Pausar / continuar">⏸</button>' +
  '<button class="bbtn" id="bignext" title="Pantalla siguiente">⏭</button></div>';

function render(){
  var sl = slides[idx];

  var html = '';
  if (sl.kind === 'title'){
    html = '<div class="card titlecard"><div class="sec">' + L[lang].pres + '</div>' +
      '<h1>' + esc(fill(L[lang].prepFor + '{{NAMES}}')) + '</h1>' +
      '<div class="sub">' + esc(client.resort || '') + '</div><div class="rule"></div>' +
      '<div class="sub">' + L[lang].titleSub + '</div>' + BIGCTL + drawImg(sl.sec) + '</div>';
  } else if (sl.kind === 'break'){
    if (sl.stop){
      /* STOPCARD_V1 (Sebastian, 2026-11-23): the post-price silence
         slide — a big red stop sign, the section word big, and his
         note verbatim under it. No drawing, no narration: just stop. */
      html = '<div class="card breakcard stopcard"><div class="sec">' + L[lang].cont + '</div>' +
        '<div class="stopsign"><span>STOP</span></div>' +
        '<div class="bigsec">' + esc(sl.sec) + '</div>' +
        '<div class="stopnote">' + esc(sl.note || '') + '</div>' +
        BIGCTL + '</div>';
    } else {
      html = '<div class="card breakcard"><div class="sec">' + L[lang].cont + '</div>' +
        '<div class="bigsec">' + esc(sl.sec) + '</div>' +
        BIGCTL + drawImg(sl.sec) + '</div>';
    }
  } else if (sl.kind === 'question'){
    var q = sl.sentences[0], no = sl.sentences[1], pf = sl.sentences[2];
    html = '<div class="card"><div class="sec">' + esc(sl.sec) + '</div>' +
      '<div class="ref">' + L[lang].qref + (idx + 1) + ' / ' + slides.length + '</div>' +
      '<div class="qtxt" data-s="' + q.s + '" data-d="' + q.d + '">' + esc(fill(q.x)) + '</div>' +
      '<div class="noans" data-s="' + no.s + '" data-d="' + no.d + '">' + esc(fill(no.x)) + '</div>' +
      '<div class="perf" data-s="' + pf.s + '" data-d="' + pf.d + '">' + esc(fill(pf.x)) + '</div>' +
      BIGCTL + drawImg(sl.sec) + '</div>';
  } else {
    /* word-level spans: the highlight window moves in halves of the
       slide's text across these; every word is rendered (dimmed)
       from slide start */
    var words = [];
    sl.sentences.forEach(function(s){
      fill(s.x).split(/\s+/).forEach(function(w){ if (w) words.push(w); });
    });
    var spans = words.map(function(w, i){
      return '<span class="w" data-w="' + i + '">' + esc(w) + '</span>';
    }).join(' ');
    html = '<div class="card"><div class="sec">' + esc(sl.sec) + '</div>' +
      '<div class="ref">' + secCount(idx) + '</div>' +
      '<div class="txt">' + spans + '</div>' + panelHTML(sl.panel) +
      BIGCTL + drawImg(sl.sec) + '</div>';
  }
  stage.innerHTML = html;
  $('counter').textContent = secCount(idx);
  $('secname').textContent = sl.sec || '';
  $('prog').style.width = ((idx + 1) / slides.length * 100) + '%';
  elapsed = 0; lastTick = null; chunkIdx = 0;
  applyChunk();
  syncModeBtn(); markRuler();
  renderRail(); /* side rail values always current for this slide's client */
  audSetupSlide(); /* narration companion track follows the slide */
}
/* ---- highlight halves: 2 steps per slide — the first half of the
   slide's text, then the second half (Sebastian, 2026-11-24) ---- */
/* SECTION COUNT (Sebastian, 2026-11-27): the counter restarts at
   every section and reads "k of K" inside the current section;
   the section name is the title. Never the global slide count. */
function secCount(i){
  var s = (slides[i] && slides[i].sec) || '', k = 0, K = 0;
  for (var j = 0; j < slides.length; j++){
    if (((slides[j].sec) || '') === s){ K++; if (j <= i) k = K; }
  }
  return k + ' of ' + K;
}
function wordEls(){ return document.querySelectorAll('#stage .txt .w'); }
function chunkCount(){
  var sl = slides[idx];
  if (!sl) return 1;
  if (sl.kind === 'question') return 3; /* question / —No. / Perfecto. */
  var W = wordEls().length;
  if (!W) return 1;
  return W > 1 ? 2 : 1; /* halves: first half, then second half */
}
function chunkRange(k){
  var W = wordEls().length, S = chunkCount();
  return [Math.round(k * W / S), Math.round((k + 1) * W / S)];
}
function applyChunk(){
  var sl = slides[idx];
  if (!sl) return;
  if (sl.kind === 'question'){
    document.querySelectorAll('#stage .qtxt, #stage .noans, #stage .perf')
      .forEach(function(el, i){
        el.classList.toggle('cur', i === chunkIdx);
        el.classList.toggle('done', i < chunkIdx);
      });
    return;
  }
  if (sl.kind !== 'text') return;
  var r = chunkRange(chunkIdx);
  wordEls().forEach(function(el, i){
    el.classList.toggle('cur', i >= r[0] && i < r[1]);
    el.classList.toggle('done', i < r[0]);
  });
}
function markCurrent(){
  if (!auto) return;
  var sl = slides[idx];
  if (sl.kind === 'question'){
    var t = sl.start + elapsed;
    document.querySelectorAll('[data-s]').forEach(function(el){
      var s = parseFloat(el.getAttribute('data-s')), d = parseFloat(el.getAttribute('data-d'));
      el.classList.toggle('cur', t >= s && t < s + d);
      el.classList.toggle('done', t >= s + d);
    });
    return;
  }
  if (sl.kind !== 'text') return;
  var S = chunkCount();
  chunkIdx = Math.min(S - 1, Math.floor(elapsed / sl.dur * S));
  applyChunk();
}
function tick(now){
  if (objOpen){ rafId = null; lastTick = null; return; } /* objections menu open: show is frozen in place */
  if (!auto || !playing){ rafId = null; lastTick = null; return; } /* lastTick cleared on EVERY stop (Sebastian bug report, 2026-11-23): a stale lastTick made elapsed jump by the whole paused duration on resume, so pause/play and FF/RW skipped and blew through slides */
  if (lastTick == null) lastTick = now;
  elapsed += (now - lastTick) / 1000 * SPEED;
  lastTick = now;
  var sl = slides[idx];
  if (audMode && audChainCur && narr && !narr.paused){
    /* audio-driven slide: the voice's position inside this slide's
       window sets the progress — highlights scale proportionally.
       prog >= 1 falls through with elapsed == sl.dur into the normal
       advance / numbers-hold logic below. If the voice is paused or
       blocked, this branch is skipped and the timer carries the slide. */
    var pos = narr.currentTime;
    if (pos < audOff - 0.30){ /* NAVPRECISION_20261125: voice BEHIND this slide's window (a seek from a jump has not landed yet) — freeze here, never chase */
      markCurrent(); rafId = requestAnimationFrame(tick); return;
    }
    if (pos > audOff + audSeg + 0.30){ /* voice AHEAD of this slide's window (stale position after a jump) — pull the voice back to this slide instead of cascading forward through slides to catch it (Sebastian: the double back arrow "jumps forward like ten minutes") */
      audSeekToElapsed(); markCurrent(); rafId = requestAnimationFrame(tick); return;
    }
    var prog = audSeg > 0 ? (pos - audOff) / audSeg : 1;
    elapsed = Math.max(0, Math.min(1, prog)) * sl.dur;
    if (prog < 1){ markCurrent(); rafId = requestAnimationFrame(tick); return; }
  }
  if (elapsed >= sl.dur){
    if (sl.panel){ /* NUMBERS HOLD (Sebastian, 2026-11-23): a slide showing a set of numbers (panel = confirm / buildup / price / pricenote / qnums — any panel slide) stays on screen for as long as it takes him to say his own words about them — no script, no auto-advance; he moves on with the double arrow */
      elapsed = sl.dur; markCurrent();
      if (!held){ held = true; syncModeBtn(); toast(sl.stop ? (lang === 'es' ? 'Silencio — ⏭ cuando ellos hablen' : 'Silence — ⏭ when they talk') : (lang === 'es' ? 'Numeros en pantalla \u2014 \u23ed para seguir' : 'Numbers on screen \u2014 \u23ed to continue')); }
      rafId = null; lastTick = null; return;
    }
    if (idx < slides.length - 1){ idx++; render(); }
    else { playing = false; syncModeBtn(); rafId = null; return; }
  } else markCurrent();
  rafId = requestAnimationFrame(tick);
}
function startTimer(){
  if (rafId == null && auto && playing){ lastTick = null; rafId = requestAnimationFrame(tick); } /* restarting the loop always starts the clock clean */
}

/* ================= NARRATION AUDIO (Sebastian, 2026-11-23) ==
   The narration voice speaking IN SYNC with the highlights, with a
   YouTube-style mute + volume on the show page (never system volume).
   Assets: audio-<lang>[-db|-fu|-fudb]/manifest.json maps slide index -> {file, dur, hash,
   joined / cross_slide / join_in / redacted_tokens}, built by
   ~/workspace/apertura-video/show-audio-es/build_show_audio.py — every
   recording is COMPLETE grammatical sentences only; fragments were
   joined, and a joined sentence's audio lives in the mp3 of the slide
   where the sentence STARTS (the following slides are join_in and
   CONTINUE that same mp3 across the slide change — never restart it).
   Engine: a per-slide companion track. On an ES slide whose chain has
   audio, the AUDIO drives the slide timing — highlight chunks advance
   proportionally across the audio's duration (each chain slide owns
   the share of the mp3 proportional to its deck duration). Slides
   with no audio (panel / break / title cards, join-through slides)
   run the timer engine at SPEED 0.85 exactly as before,
   and a numbers panel still HOLDS silently. Pause / step / hold pause the
   voice too; unmuting mid-slide resumes it at the elapsed proportion.
   Autoplay-with-sound can be blocked before the first user gesture —
   the timer carries the show until a gesture unlocks the voice. */
var narr = $('narr');
var audManifest = null;   /* loaded async; null = timer engine only */
var audManifests = {};    /* per language+type manifests, loaded async */
var audDir = null;        /* audio directory of the active manifest */
/* ENAUDIO_V1 (Sebastian, 2026-11-23): which narration (if any) belongs
   to this view. MTG and DB decks narrate in both languages (audio-es /
   audio-en / audio-es-db / audio-en-db); the EN follow-up decks
   narrate too, chosen by the record's own type (audio-en-fu /
   audio-en-fudb). Spanish FU falls back to the ES MTG deck in the
   player but stays silent here — unchanged from before. Anything
   else: no narration. */
function audResolve(){
  if (dtype === 'MTG') return { key: lang + '|MTG', dir: lang === 'en' ? 'audio-en' : 'audio-es' };
  if (dtype === 'DB') return { key: lang + '|DB', dir: lang === 'en' ? 'audio-en-db' : 'audio-es-db' };
  if (dtype === 'FU' && lang === 'en'){
    var rt = recTypeOverride || (client && client.dtype);
    return rt === 'DB' ? { key: 'en|FUDB', dir: 'audio-en-fudb' } : { key: 'en|FU', dir: 'audio-en-fu' };
  }
  return null;
}
var audMode = false;      /* the current slide is audio-driven */
var audChainCur = null;   /* {start, end, entry} of the loaded chain */
var audOff = 0, audSeg = 0; /* this slide's window inside the chain mp3 */
var showMuted = false, showVolume = 1;
try {
  showMuted = localStorage.getItem('showMuted') === '1';
  var sv0 = parseFloat(localStorage.getItem('showVolume'));
  if (!isNaN(sv0)) showVolume = Math.max(0, Math.min(1, sv0));
} catch(e){}
if (narr){ narr.muted = showMuted; narr.volume = showVolume; }
function audChain(i){
  if (!audManifest) return null;
  var s = i;
  while (s > 0 && audManifest[s] && audManifest[s].join_in) s--;
  var e0 = audManifest[s];
  if (!e0 || !e0.file) return null;
  var e = s;
  while (audManifest[e + 1] && audManifest[e + 1].join_in) e++;
  return { start: s, end: e, entry: e0 };
}
/* WORD-LEVEL SILENCE (Sebastian, 2026-11-23, corrected the same day —
   "just the one word, the dollar amount only or client name only, the
   rest I want said out loud"): token sentences are NOT silent slides.
   The audio builder synthesizes them in redacted form — the whole
   sentence spoken except the client-specific word itself, which is
   just a beat in the track; Sebastian fills that one word live. The
   player needs no special case: the redacted mp3 drives the slide
   like any other, highlights scaling proportionally across it, so the
   chunk carrying the token occupies the beat. */
function audStop(){
  audMode = false; audChainCur = null;
  if (narr && !narr.paused) narr.pause();
}
function audPlay(){
  if (!narr) return;
  var p = null;
  try { p = narr.play(); } catch(e){}
  if (p && p.catch) p.catch(function(){ /* blocked until first gesture — the timer carries the show */ });
}
function audSeekToElapsed(){
  if (!audMode || !audChainCur || !slides.length) return;
  var sl = slides[idx];
  if (!sl || audSeg <= 0) return;
  var target = audOff + (sl.dur > 0 ? elapsed / sl.dur : 0) * audSeg;
  var max = audChainCur.entry.dur || target;
  try { narr.currentTime = Math.max(0, Math.min(max, target)); } catch(e){}
}
function audSetupSlide(){
  if (!narr) return;
  /* ENAUDIO_V1: the active manifest follows language AND deck type
     (see audResolve) — a manifest that has not loaded, or does not
     exist, leaves the timer engine in charge, exactly as the original
     ES-only build behaved with no manifest. */
  var R = audResolve();
  audManifest = R ? (audManifests[R.key] || null) : null;
  audDir = R ? R.dir : null;
  if (!R || !audManifest || !slides.length){ audStop(); return; }
  var ch = audChain(idx);
  if (!ch){ audStop(); return; }
  var sum = 0, k;
  for (k = ch.start; k <= ch.end; k++) sum += slides[k].dur;
  if (sum <= 0){ audStop(); return; }
  var off = 0;
  for (k = ch.start; k < idx; k++) off += ch.entry.dur * slides[k].dur / sum;
  var same = audChainCur && audChainCur.entry.file === ch.entry.file && audChainCur.dir === audDir;
  audChainCur = ch; audChainCur.dir = audDir; audOff = off;
  audSeg = ch.entry.dur * slides[idx].dur / sum;
  audMode = true;
  if (!same){
    narr.src = audDir + '/' + ch.entry.file;
    narr._seekOnLoad = off > 0.05 ? off : null;
    try { narr.load(); } catch(e){}
  } else if (Math.abs(narr.currentTime - off) > 0.25){ /* NAVPRECISION_20261125: tighter seek tolerance so a jump lands the voice on the slide's window */
    try { narr.currentTime = off; } catch(e){} /* jumped into the chain: land on this slide's window */
  }
  if (auto && playing && !held) audPlay();
}
function audSyncBtn(){
  var b = $('mutebtn');
  if (b) b.textContent = showMuted ? '🔇' : '🔊';
  var s = $('volslider');
  if (s) s.value = Math.round(showVolume * 100);
}
if (narr){
  narr.addEventListener('loadedmetadata', function(){
    if (narr._seekOnLoad != null){
      try { narr.currentTime = narr._seekOnLoad; } catch(e){}
      narr._seekOnLoad = null;
    }
  });
  narr.addEventListener('ended', function(){
    if (audMode && audChainCur && idx === audChainCur.end && auto && playing && !held){
      if (idx < slides.length - 1) go(idx + 1);
      else { playing = false; syncModeBtn(); }
    }
  });
}
document.addEventListener('pointerdown', function(){
  if (audMode && auto && playing && narr && narr.paused){ audSeekToElapsed(); audPlay(); }
}, true);
if (window.fetch){
  [['es|MTG', 'audio-es'], ['en|MTG', 'audio-en'], ['es|DB', 'audio-es-db'],
   ['en|DB', 'audio-en-db'], ['en|FU', 'audio-en-fu'], ['en|FUDB', 'audio-en-fudb']
  ].forEach(function(cfg){
    fetch(cfg[1] + '/manifest.json').then(function(r){ return r.json(); }).then(function(m){
      audManifests[cfg[0]] = m;
      audSetupSlide(); /* the boot render may already have happened */
    }).catch(function(){ /* no manifest reachable: timer engine, exactly as before */ });
  });
}
audSyncBtn();
function go(n){
  held = false;
  idx = Math.max(0, Math.min(slides.length - 1, n));
  render(); audSeekToElapsed(); startTimer(); /* NAVPRECISION_20261125: one tap = exactly one screen, voice synced to its start */
}
/* the mode button always tells the truth: while a numbers slide is
   HELD it says so (Sebastian read "AUTOSCROLL: ON" on a frozen show as
   broken) — the normal AUTOSCROLL/MANUAL label returns on the next slide */
function syncModeBtn(){
  if (held) $('modebtn').textContent = (slides[idx] && slides[idx].stop)
    ? '⏸ ' + (lang === 'es' ? 'Silencio — ⏭ cuando ellos hablen' : 'Silence — ⏭ when they talk')
    : ((lang === 'es') ? '⏸ EN PAUSA — NÚMEROS' : '⏸ HELD — NUMBERS');
  else $('modebtn').textContent = auto ? 'AUTOSCROLL: ON' : 'MANUAL';
  /* BOTH play glyphs — the small #play and the BIG mid-stage #bigplay —
     are written HERE and nowhere else, derived from the one predicate:
     ⏸ while the show is actually advancing, ▶ whenever it is stopped
     (paused, held on a numbers slide, or stepped into MANUAL) */
  var glyph = (auto && playing && !held) ? '⏸' : '▶';
  var bp = $('bigplay');
  if (bp) bp.textContent = glyph;
  var sp = $('play');
  if (sp) sp.textContent = glyph;
}
function setAuto(on){
  auto = on;
  playing = on; /* both flags set BEFORE the glyph sync — MANUAL is stopped,
                   AUTOSCROLL is playing; no stale-flag window in between */
  document.body.classList.toggle('auto', auto);
  syncModeBtn();
  if (auto){ if (audMode){ audSeekToElapsed(); audPlay(); } startTimer(); }
  else { if (narr && !narr.paused) narr.pause(); applyChunk(); } /* MANUAL keeps the current chunk highlighted; stepping manually stops the voice */
}
/* PLAY/PAUSE — the ONE toggle behind the small button, the BIG mid-stage
   button (the stage delegation routes it to the small one), the spacebar
   and the click-the-screen surface, so state and glyph can never drift
   apart again. Live bug (Sebastian, 2026-11-23): on a HELD numbers slide
   the old toggle flipped `playing` behind the hold — the show never
   moved and the big glyph never changed; he hit it and nothing happened.
   From HELD, play releases the hold and advances, same as ⏭. */
function togglePlay(){
  if (!slides.length) return;
  if (held){
    held = false;
    if (idx < slides.length - 1){ setAuto(true); go(idx + 1); }
    else { playing = false; syncModeBtn(); }
    return;
  }
  if (!auto){ setAuto(true); return; }
  playing = !playing;
  syncModeBtn();
  if (!playing){ if (narr && !narr.paused) narr.pause(); } /* the voice pauses with the show */
  else if (audMode){ audSeekToElapsed(); audPlay(); }
  if (playing) startTimer();
}
/* NAVIGATION (Sebastian, 2026-11-24 — supersedes the 2026-11-23
   scheme): the BIG steppers are the DOUBLE arrows (⏮/⏭) and jump
   between SLIDES/screens — the big single arrow is gone, so the next
   screen is one tap away. SINGLE arrows (◀/▶, small buttons and the
   plain keyboard arrows) step the HIGHLIGHT HALF within the slide;
   Shift+Arrow also jumps slides. Single-next on the last half
   advances to the next slide; single-prev on the first half goes
   back to the previous slide (landing on its last half). Stepping
   a half while AUTOSCROLL runs pauses it into MANUAL so the
   operator controls the pace. */
function stepChunk(dir){
  if (!slides.length) return;
  if (auto){ markCurrent(); setAuto(false); }
  var S = chunkCount();
  var nk = chunkIdx + dir;
  if (nk >= S){ if (idx < slides.length - 1) go(idx + 1); return; }
  if (nk < 0){
    if (idx > 0){
      idx--; render();
      chunkIdx = chunkCount() - 1; applyChunk();
    }
    return;
  }
  chunkIdx = nk; applyChunk();
}
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(function(){ t.style.display = 'none'; }, 4200);
}

/* ================= CHAPTER RULER (Sebastian, 2026-11-23) =================
   Section ticks + labels above the progress bar, built from the loaded
   deck's data at runtime (unique sections in deck order, positioned by
   first-slide index — never hard-coded, so new sections like the UCFS
   application + DocuSign closing appear automatically) and rebuilt on
   language switch. Clicking the ruler/bar jumps proportionally;
   clicking a label jumps to that section's first slide. Rebuttals stay
   on the 🛡️ Objeciones button in the controls row. Long names shorten
   at the " — " suffix and ellipsize inside their pill. */
var rulerSecs = [];
function buildRuler(){
  var r = $('ruler');
  if (!r) return;
  rulerSecs = [];
  slides.forEach(function(sl, i){
    if (sl.sec && !rulerSecs.some(function(s){ return s.sec === sl.sec; }))
      rulerSecs.push({ sec: sl.sec, first: i });
  });
  var total = slides.length || 1;
  var html = '';
  var GDOTS = ['#4285F4', '#EA4335', '#FBBC05', '#34A853']; /* RULERDOTS_20261125: Google colors, repeating */
  function oneWord(sec){
    var base = sec, cut = base.indexOf(' — ');
    if (cut >= 4) base = base.slice(0, cut);
    var stop = { THE:1, EL:1, LA:1, LOS:1, LAS:1, UN:1, UNA:1, DE:1, DEL:1, OF:1, Y:1, E:1, A:1 };
    var words = base.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, ' ').split(/\s+/).filter(function(w){ return w && !stop[w.toUpperCase()]; });
    if (!words.length) return base;
    var w = words[0];
    return (w.length <= 5 && w === w.toUpperCase()) ? w : (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  }
  rulerSecs.forEach(function(s, k){
    var pct = s.first / total * 100;
    var tx = pct < 5 ? '-8%' : (pct > 95 ? '-92%' : '-50%');
    var col = GDOTS[k % GDOTS.length];
    html += '<div class="rtick" style="left:' + pct + '%;background:' + col + '"></div>' +
      '<button class="rlab row' + (k % 2) + '" data-first="' + s.first + '" title="' + esc(s.sec) +
      '" style="left:' + pct + '%;transform:translateX(' + tx + ')"><span class="rdot" style="background:' + col + '"></span>' + esc(oneWord(s.sec)) + '</button>';
  });
  r.innerHTML = html;
  markRuler();
}
function markRuler(){
  var r = $('ruler');
  if (!r || !slides.length) return;
  var cur = -1;
  rulerSecs.forEach(function(s, k){ if (s.first <= idx) cur = k; });
  r.querySelectorAll('.rlab').forEach(function(b, k){ b.classList.toggle('cur', k === cur); });
  r.querySelectorAll('.rtick').forEach(function(b, k){ b.classList.toggle('cur', k === cur); });
}

/* background VIDEO (Sebastian, 2026-11-23) — the rolling watercolor
   montage from the downloaded karaoke video, web-encoded in img/.
   BY LANGUAGE (Sebastian, 2026-11-23): the SPANISH show runs the
   South-American folkloric montage (img/bg-montage.mp4); the ENGLISH
   show runs the AMERICAN montage (img/bg-montage-en.mp4) — the
   language toggle swaps the video source too (setBgVideo, called from
   setLang). It fades in over the photo layers only once it can
   actually play, and runs continuously across slides (render() never
   touches it). Failure chain: EN file fails -> ES montage -> the
   folk-photo rotation above carries on exactly as before. */
var bgvDead = { es: false, en: false };
function bgSrcFor(l){ return l === 'en' ? 'img/bg-montage-en.mp4' : 'img/bg-montage.mp4'; }
function setBgVideo(){
  var v = $('bgvid');
  if (!v) return;
  var want = bgSrcFor(lang);
  if (bgvDead[lang]){
    if (lang === 'en' && !bgvDead.es) want = bgSrcFor('es'); /* EN dead: ES montage carries the EN show */
    else { v.classList.remove('on'); v.style.display = 'none'; try { v.pause(); } catch(e){} return; }
  }
  v.style.display = '';
  if (v.getAttribute('src') !== want){
    v.setAttribute('src', want);
    try { v.load(); } catch(e){}
    setTimeout(function(){
      if (v.getAttribute('src') === want && v.readyState === 0) bgvFail();
    }, 20000);
  }
  var p = null;
  try { p = v.play(); } catch(e){ /* ancient browser: photos carry on */ }
  if (p && p.catch) p.catch(function(){ /* autoplay blocked: stay on the photos */ });
}
function bgvFail(){
  var v = $('bgvid');
  if (!v) return;
  var cur = v.getAttribute('src');
  if (lang === 'en' && cur === bgSrcFor('en') && !bgvDead.es){
    bgvDead.en = true; /* the American file failed: fall back to the ES montage */
    setBgVideo();
    return;
  }
  if (cur === bgSrcFor('es')) bgvDead.es = true; else bgvDead.en = true;
  v.classList.remove('on');
  v.style.display = 'none';
  try { v.pause(); } catch(e){}
}
(function(){
  var v = $('bgvid');
  if (!v) return;
  v.addEventListener('error', function(){ bgvFail(); }, true);
  v.addEventListener('canplay', function(){ if (v.style.display !== 'none') v.classList.add('on'); });
  setBgVideo();
})();

/* controls — the BIG ⏮/⏭ steppers jump slides (routed through the

   step the highlight half (see stepChunk). The old small ⏮/⏭
   slide buttons were removed 2026-11-24: the big steppers are the
   one and only slide prev/next controls now. */
$('nextchunk').addEventListener('click', function(){ stepChunk(1); });
$('prevchunk').addEventListener('click', function(){ stepChunk(-1); });
$('play').addEventListener('click', togglePlay);
/* ============ CLICK THE SCREEN = PLAY/PAUSE (Sebastian, 2026-11-23):
   clients answer and interject mid-pitch, so the whole slide surface
   is the pause button: one click/tap on the stage pauses; the next
   click re-engages AUTOSCROLL and resumes from the current chunk —
   including out of MANUAL after highlight stepping. The BIG mid-stage
   buttons are routed first (slide jumps / the play toggle); any
   other interactive element never toggles. Feedback is the existing
   toast, kept brief. ============ */
function flashToggle(msg){
  toast(msg);
  var t = $('toast');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, 900);
}
function toggleStagePlay(){
  if (objOpen || !slides.length) return;
  togglePlay(); /* the same single toggle as the play buttons — including
                   releasing a numbers HOLD by advancing */
  var advancing = auto && playing && !held;
  flashToggle(advancing ? (lang === 'es' ? '▶ Autoscroll' : '▶ Autoscroll')
                        : (lang === 'es' ? '⏸ Pausa' : '⏸ Paused'));
}
$('stage').addEventListener('click', function(e){
  var t = e.target;
  if (!t || !t.closest) return;
  var bc = t.closest('#bigprev, #bignext, #bigplay');
  if (bc){
    if (bc.id === 'bigprev') go(idx - 1);
    else if (bc.id === 'bignext') go(idx + 1);
    else $('play').click();
    return; /* the big buttons act, they never also toggle */
  }
  if (t.closest('button, a, select, input, textarea, #rail, #seekzone, #objwrap, #obj')) return;
  toggleStagePlay();
});
$('modebtn').addEventListener('click', function(){ setAuto(!auto); });
/* narration mute + volume — YouTube-style, on the show page only: they
   drive ONLY the narration <audio> element (the background video is
   muted by design; system/browser volume is never touched) and

   the voice while the show continues; unmuting mid-slide resumes the

$('mutebtn').addEventListener('click', function(){

  if (narr) narr.muted = showMuted;

});

$('seekzone').addEventListener('click', function(e){
  if (!slides.length) return;
  var lab = e.target.closest('.rlab');
  if (lab){ go(+lab.getAttribute('data-first')); return; } /* label = section start */
  var rect = $('seekzone').getBoundingClientRect();
  var frac = (e.clientX - rect.left) / rect.width;
  frac = Math.max(0, Math.min(0.9999, frac));
  go(Math.floor(frac * slides.length)); /* bar/ruler = proportional jump */
});
document.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName === 'INPUT') return; /* typing in the side-rail editor is not a show shortcut */
  if (objOpen){ if (e.key === 'Escape') closeObj(); return; }
  /* Right/Left = highlight steps; PageDown/PageUp or Shift+Right/Left =
     slides; spacebar = play/pause */
  if (e.key === 'PageDown'){ e.preventDefault(); go(idx + 1); }
  else if (e.key === 'PageUp'){ e.preventDefault(); go(idx - 1); }
  else if (e.key === 'ArrowRight' && e.shiftKey) go(idx + 1);
  else if (e.key === 'ArrowLeft' && e.shiftKey) go(idx - 1);
  else if (e.key === 'ArrowRight') stepChunk(1);
  else if (e.key === 'ArrowLeft') stepChunk(-1);
  else if (e.key === ' '){ e.preventDefault(); $('play').click(); }
});
/* deck loading — ONE path for boot, language switches and type
   switches: the deck for (lang, dtype); the slide index is kept when
   it exists in the new deck (else clamped to the last slide); play
   state is preserved (render + startTimer resume the show). */
function loadDeck(){
  DECK = deckFor(lang, dtype, recTypeOverride || (client && client.dtype));
  slides = DECK ? DECK.slides : [];
  idx = Math.max(0, Math.min(slides.length - 1, idx));
  buildRuler(); /* chapter ruler follows the loaded deck */
  render(); startTimer();
}

    { t: 'El enlace — Yaz', x: "Y les digo, recuerden cuando yo les dije que somos la única compañía que hasta haciendo cancelaciones legítimas y somos la número uno, bueno, lo queremos mantener de esa manera." },
    { t: 'La respuesta al abogado — Yaz', x: "Ustedes lo que necesitan es una compañía especialista especializada y que solamente haga cancelación de tiempo compartidos y para la suerte de ustedes nosotros somos la número uno en estados unidos en cancelación de tiempos compartidos cuando nosotros iniciamos esto nadie estaba haciéndolo en estados unidos nosotros somos la compañía con más experiencia y llevamos 17 años solamente haciendo este tipo de servicio." }
  ]
};
var objOpen = false;
var objView = { level: 'cats', cat: -1, sub: -1, item: -1 };
function objTree(){ return OBJD[lang] || []; }
function objCount(c){ return c.subs.reduce(function(n, s){ return n + s.items.length; }, 0); }
function openObj(){
  if (objOpen) return;
  objOpen = true;
  objView = { level: 'cats', cat: -1, sub: -1, item: -1 };
  /* menu background = the frame currently on stage */
  var live = $('bg1').classList.contains('on') ? $('bg1') : $('bg2');
  $('objbg').style.backgroundImage = live.style.backgroundImage || ('url(' + bgUrl(0) + ')');
  $('obj').classList.add('open');
  if (rafId != null){ cancelAnimationFrame(rafId); rafId = null; }
  if (narr && !narr.paused) narr.pause(); /* the voice freezes with the show */
  renderObj();
}
function closeObj(){
  if (!objOpen) return;
  objOpen = false;
  $('obj').classList.remove('open');
  lastTick = null; /* resume the frozen slide cleanly */
  if (audMode && auto && playing){ audSeekToElapsed(); audPlay(); }
  startTimer();
}
function renderObj(){
  var t = OBJL[lang], tree = objTree(), w = $('objwrap');
  var nav = '<div class="objnav">';
  if (objView.level === 'subs') nav += '<button class="objpill" data-act="cats">' + t.cats + '</button>';
  if (objView.level === 'items') nav += '<button class="objpill" data-act="subs">' + t.subs + '</button>';
  if (objView.level === 'reb') nav += '<button class="objpill" data-act="items">‹ ' + esc(tree[objView.cat].subs[objView.sub].sub) + '</button>';
  if (objView.level === 'rep') nav += '<button class="objpill" data-act="cats">' + t.cats + '</button>';
  if (objView.level === 'docu') nav += '<button class="objpill" data-act="cats">' + t.cats + '</button>';
  nav += '<div class="sp"></div><button class="objpill" data-act="exit">' + t.exit + '</button></div>';
  var html = nav;
  if (objView.level === 'cats'){
    html += '<div class="objtitle">' + t.title + '</div><div class="objlist">';
    tree.forEach(function(c, i){
      html += '<button class="objitem" data-act="cat" data-i="' + i + '">' + c.icon + ' ' + esc(c.cat) +
        '<span class="cnt">' + objCount(c) + '</span></button>';
    });
    html += '<button class="objitem" data-act="rep">' + t.rep + '</button>';
    html += '<button class="objitem" data-act="docu">' + t.docu + '</button>';
    html += '</div>';
  } else if (objView.level === 'rep'){
    html += '<div class="objtitle">' + t.repT + '</div>';
    html += '<div class="repsec">' + t.repOnline + '</div><div class="objlist">';
    REPD.videos.forEach(function(v){
      html += '<a class="objitem" href="' + v.f + '" target="_blank" rel="noopener">▶ ' + esc(v.t) + '</a>';
    });
    html += '</div><div class="repsec">' + t.repScript + '</div><div class="objlist">';
    (REPD[lang] || REPD.en).forEach(function(p){
      html += '<div class="reptext"><span class="rept">' + esc(p.t) + '</span>' + esc(p.x) + '</div>';
    });
    html += '</div>';
  } else if (objView.level === 'docu'){
    html += '<div class="objtitle">' + t.docuT + '</div>';
    html += '<div class="docnote">' + esc(DOCU_LEGEND.head) + '</div>';
    html += '<table class="doctable"><thead><tr><th>CUÁNDO / WHEN</th><th>REGLA — ES</th><th>RULE — EN</th><th>DÓNDE / WHERE</th></tr></thead><tbody>';
    DOCU_LEGEND.rows.forEach(function(r){
      html += '<tr><td class="dlw">' + esc(r.w) + '</td><td>' + esc(r.es) + '</td><td>' + esc(r.en) + '</td><td class="dlw">' + esc(r.d) + '</td></tr>';
    });
    html += '</tbody></table><div class="docnote">' + esc(DOCU_LEGEND.foot) + '</div>';
  } else if (objView.level === 'subs'){
    var c2 = tree[objView.cat];
    html += '<div class="objtitle">' + t.title + '</div><div class="objhead">' + c2.icon + ' ' + esc(c2.cat) + '</div><div class="objlist">';
    c2.subs.forEach(function(s, j){
      html += '<button class="objitem" data-act="sub" data-j="' + j + '">' + esc(s.sub) +
        '<span class="cnt">' + s.items.length + '</span></button>';
    });
    html += '</div>';
  } else if (objView.level === 'items'){
    var c3 = tree[objView.cat], s3 = c3.subs[objView.sub];
    html += '<div class="objtitle">' + esc(c3.cat) + '</div><div class="objhead">' + esc(s3.sub) + '</div><div class="objlist">';
    s3.items.forEach(function(it, k){
      html += '<button class="objitem" data-act="item" data-k="' + k + '">“' + esc(it.o) + '”</button>';
    });
    html += '</div>';
  } else { /* reb — the rebuttal, his words, client numbers filled live */
    var it2 = tree[objView.cat].subs[objView.sub].items[objView.item];
    html += '<div class="objtitle">' + esc(tree[objView.cat].cat) + ' · ' + esc(tree[objView.cat].subs[objView.sub].sub) + '</div>' +
      '<div class="objq">“' + esc(it2.o) + '”</div>' +
      '<div class="objreb">' + esc(fill(it2.r)) + '</div>';
  }
  w.innerHTML = html;
  w.scrollTop = 0;
}
$('objbtn').addEventListener('click', openObj);
$('objwrap').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'exit') closeObj();
  else if (act === 'cats'){ objView.level = 'cats'; renderObj(); }
  else if (act === 'subs'){ objView.level = 'subs'; renderObj(); }
  else if (act === 'items'){ objView.level = 'items'; renderObj(); }
  else if (act === 'rep'){ objView.level = 'rep'; renderObj(); }
  else if (act === 'docu'){ objView.level = 'docu'; renderObj(); }
  else if (act === 'cat'){ objView.cat = +b.getAttribute('data-i'); objView.level = 'subs'; renderObj(); }
  else if (act === 'sub'){ objView.sub = +b.getAttribute('data-j'); objView.level = 'items'; renderObj(); }
  else if (act === 'item'){ objView.item = +b.getAttribute('data-k'); objView.level = 'reb'; renderObj(); }
});

/* ================= SIDE RAIL (Sebastian, 2026-11-23) =================
   Persistent right-hand column: client names, resort, the confirmed
   numbers, price, down payment and amount financed — on screen for
   EVERY slide. The money values are EDITABLE in place: click one, type
   the corrected figure, Enter — the override is saved per client in
   localStorage ("showOverridesV1") and everything downstream (panels,
   slide-text tokens, price, ladder, objections rebuttal numbers)
   recomputes instantly, because they all read the same effective
   client + derived. clients.js carries NO city field and NO down
   field on any record: the rail shows the record's resort only, and
   down starts as "—" (financed too) until Sebastian types one —
   a down value is never invented. */
var OV_KEY = 'showOverridesV1';
var overrides = {};
try { overrides = JSON.parse(localStorage.getItem(OV_KEY) || '{}') || {}; } catch(e){ overrides = {}; }
var baseClient = null;      /* the untouched record from clients.js */
var derivedStale = false;   /* last edit made deriveClient() return null; previous derived kept */
var railWarn = null;        /* field whose cell shows the warning color while stale */
var railEditing = false;    /* an input is open in the rail — renders must not clobber it */
function saveOverrides(){ try { localStorage.setItem(OV_KEY, JSON.stringify(overrides)); } catch(e){} }
function effClient(){
  var c = {};
  for (var k in baseClient) c[k] = baseClient[k];
  var ov = overrides[clientId] || {};
  ['pyr','payoff','mmo','mf','fee','down'].forEach(function(f){ if (ov[f] != null) c[f] = ov[f]; });
  return c;
}
function recompute(lastField){
  client = effClient();
  var d = deriveClient(client) || deriveDb(client);
  if (d){ derived = d; derivedStale = false; railWarn = null; }
  else { derivedStale = true; railWarn = lastField || null; } /* keep previous derived — never crash */
  ensureMf();
  ensureNewFigs();
}
function railDown(){
  var ov = overrides[clientId] || {};
  if (ov.down != null) return +ov.down;
  if (baseClient && baseClient.down != null) return +baseClient.down;
  return null;
}
function renderRail(){
  if (railEditing) return; /* never clobber an open editor */
  var body = $('railbody');
  if (!body || !client) return;
  var t = L[lang];
  var names = client.firstNames || client.name || '';
  if (lang === 'en' && names) names = names.replace(/ y /g, ' and ');
  var mf = +client.mf || 0, mmo = +client.mmo || 0;
  var mfmo = Math.floor(mf / 12);
  var down = railDown();
  var price = derived ? derived.price : null;
  var fin = (price != null && down != null) ? Math.round((price - down) * 100) / 100 : null;
  var isMTG = client.dtype === 'MTG';
  function row(label, val, field){
    var cls = 'rval' + (field ? ' ed' : '') + (field && railWarn === field ? ' warn' : '');
    return '<div class="rrow"><div class="rlab2">' + label + '</div>' +
      '<div class="' + cls + '"' + (field ? ' data-f="' + field + '" title="' + t.rEdit + '"' : '') + '>' + val + '</div></div>';
  }
  var h = '<div class="rname">' + esc(names) + '</div>' +
    '<div class="rresort">' + esc(client.resort || '—') + '</div>' +
    '<div class="rsec">' + t.confirmT + '</div>';
  if (isMTG || client.pyr) h += row(t.pyr, client.pyr ? String(client.pyr) : '—', 'pyr');
  if (isMTG){
    /* confirm rows are direct formats of the effective inputs, so the
       rail always shows the true current figures even while a full
       derivation is stale */
    h += row(t.payoff, fmtC(+client.payoff || 0), 'payoff');
    h += row(t.mmo, fmtC(mmo), 'mmo');
    h += row(t.mf, fmtD(mfmo) + ' · ' + fmtC(mf), 'mf');
    h += row(t.total, fmtC(mmo + mfmo) + ' · ' + fmtC(mmo * 12 + mf), null);
  } else if (mf > 0){
    h += row(t.mf, fmtD(mfmo) + ' · ' + fmtC(mf), 'mf');
  }
  var lad = null;
  if (derived && derived.f){
    if (isMTG && derived.f.t1 && derived.f.t3) lad = [derived.f.t1, derived.f.t3, derived.f.t5, derived.f.t10, derived.f.t20];
    else if (!isMTG && derived.f.mf3) lad = [derived.f.t1, derived.f.mf3, derived.f.mf5, derived.f.mf10, derived.f.mf20];
  }
  if (lad){
    h += '<div class="rsec">' + t.ladT + '</div>';
    for (var li = 0; li < 5; li++) h += row(t.ladYrs[li], lad[li], null);
  }
  h += row(t.rInv, price != null ? fmtD(price) : '—', 'fee');
  h += row(t.rDown, down != null ? fmtC(down) : '—', 'down');
  h += row(t.rFin, fin != null ? fmtC(fin) : '—', null);
  h += '<div class="rreset" id="rreset">' + t.rReset + '</div>';
  body.innerHTML = h;
  var rs = $('rreset');
  if (rs) rs.addEventListener('click', function(){
    delete overrides[clientId];
    saveOverrides();
    recompute(null);
    renderRail();
    render(); /* record values restored everywhere */
  });
}
function railRaw(field){
  if (field === 'pyr') return client.pyr || '';
  if (field === 'payoff') return client.payoff || '';
  if (field === 'mmo') return client.mmo || '';
  if (field === 'mf') return client.mf || '';
  if (field === 'fee') return derived ? derived.price : '';
  if (field === 'down'){ var d = railDown(); return d != null ? d : ''; }
  return '';
}
function commitRailEdit(field, raw){
  var v = parseFloat(String(raw).replace(/[$,\s]/g, ''));
  if (isNaN(v)){ renderRail(); return; } /* not a number: revert the display, keep the prior value */
  if (field === 'pyr') v = Math.round(v);
  if (!overrides[clientId]) overrides[clientId] = {};
  overrides[clientId][field] = v;
  saveOverrides();
  recompute(field);
  renderRail();
  render(); /* same slide, new numbers — panels, tokens, price, ladder and objections follow */
}
function openRailEdit(span){
  var field = span.getAttribute('data-f');
  if (!field || railEditing) return;
  railEditing = true;
  var inp = document.createElement('input');
  inp.className = 'redit'; inp.type = 'text'; inp.inputMode = 'decimal';
  inp.value = railRaw(field);
  span.textContent = ''; span.appendChild(inp);
  inp.focus(); inp.select();
  var done = false;
  function finish(commit){
    if (done) return; done = true;
    railEditing = false;
    if (commit) commitRailEdit(field, inp.value);
    else renderRail();
  }
  inp.addEventListener('keydown', function(e){
    e.stopPropagation();
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', function(){ finish(true); });
  inp.addEventListener('click', function(e){ e.stopPropagation(); });
}
$('railbody').addEventListener('click', function(e){
  var span = e.target.closest ? e.target.closest('.rval.ed') : null;
  if (span) openRailEdit(span);
});
$('railtoggle').addEventListener('click', function(){ $('rail').classList.toggle('open'); });

/* boot */
baseClient = CLIENTS[clientId];
(function(){
  var ov = overrides[clientId];
  var hasOv = !!(ov && Object.keys(ov).length > 0);
  client = effClient();
  if (hasOv){
    derived = deriveClient(client) || deriveDb(client);
    if (!derived){ derived = baseClient.derived || null; derivedStale = !!derived; }
  } else {
    derived = baseClient.derived || deriveClient(client) || deriveDb(client);
  }
  ensureMf(); /* stored derived blocks predate the MF figures — merge them in */
  ensureNewFigs(); /* ...and predate {{T1}} / {{LISTA}} — merge those too */
})();
document.body.classList.add('rail-on');
$('objbtn').textContent = OBJL[lang].btn;
document.documentElement.lang = lang;
$('btnEs').classList.toggle('act', lang === 'es');
$('btnEn').classList.toggle('act', lang === 'en');
syncHl();
/* deck type: ?type=mtg|db wins; otherwise the record decides (a
   deed-back record opens the deed-back deck). The header MTG|DB
   toggle can flip it live from here. */
if (!dtype) dtype = client.dtype === 'DB' ? 'DB' : 'MTG';
if (dtype !== 'FU' && !DECKS[lang][dtype]) dtype = dtype === 'DB' ? 'MTG' : 'DB';
syncTypeBtns();
if (!deckFor(lang, dtype, recTypeOverride || (client && client.dtype))){
  $('stage').innerHTML = '<div class="card"><div class="notice">Deck data missing.</div></div>';
} else {
  document.body.classList.add('auto');
  loadDeck();
}
</script>
