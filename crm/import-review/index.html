<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Mapping Review — Sebastianlinks</title>
<style>
:root {
  --bg: #f5f7fa; --card: #ffffff; --text: #17202a; --muted: #687385;
  --border: #dfe4ea; --primary: #1f6feb; --primary-dark: #1557b0;
  --success: #16803c; --warning: #a15c00; --danger: #b42318;
  --soft-blue: #eef5ff; --soft-green: #edf9f1; --soft-yellow: #fff8e6; --soft-red: #fff0ef;
  --radius: 14px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 80px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
.notice { padding: 12px 16px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
.notice.info { background: var(--soft-blue); color: #174a8b; }
.notice.warning { background: var(--soft-yellow); color: var(--warning); }
.notice.success { background: var(--soft-green); color: var(--success); }
.notice.error { background: var(--soft-red); color: var(--danger); }
input[type=text] { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; width: 100%; max-width: 320px; }
button { font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled { background: #b9c5d3; cursor: not-allowed; }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr.row-flagged { background: var(--soft-yellow); }
.source-header { font-weight: 600; }
.confidence-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; }
.confidence-high { background: var(--soft-green); color: var(--success); }
.confidence-medium { background: var(--soft-blue); color: #174a8b; }
.confidence-low { background: var(--soft-yellow); color: var(--warning); }
.confidence-none { background: #f0f2f5; color: var(--muted); }
.status-pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px; }
.status-ok { background: var(--soft-green); color: var(--success); }
.status-review { background: var(--soft-red); color: var(--danger); }
select { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; max-width: 220px; }
.hidden { display: none !important; }
.approve-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--card); border-radius: var(--radius); max-width: 480px; width: 100%; max-height: 80vh; display: flex; flex-direction: column; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { margin: 0; font-size: 15px; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
.modal-search { padding: 12px 20px; border-bottom: 1px solid var(--border); }
.modal-search input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; max-width: none; }
.modal-list { overflow-y: auto; flex: 1; padding: 8px; }
.modal-option { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.modal-option:hover { background: var(--soft-blue); }
.modal-option.special { font-weight: 700; color: var(--warning); }
.modal-option.special.ignore { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🗺️ Import Mapping Review</h1>
  <div class="subtitle">Confirm or correct how each source column maps to the CRM Master Leads schema before approving.</div>

  <!-- STEP 0: passphrase -->
  <div class="card" id="passphrase-card">
    <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Access Passphrase</label>
    <input type="text" id="passphrase-input" placeholder="Enter passphrase" autocomplete="off">
    <div style="margin-top:12px"><button class="btn-primary" onclick="submitPassphrase()">Unlock</button></div>
    <div id="passphrase-status" class="notice error hidden" style="margin-top:12px"></div>
  </div>

  <!-- STEP 1: find upload -->
  <div class="card hidden" id="find-upload-card">
    <label style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Import Batch ID</label>
    <input type="text" id="upload-id-input" placeholder="batch-...">
    <div style="margin-top:12px"><button class="btn-primary" onclick="loadMapping()">Load Mapping</button></div>
  </div>

  <!-- STEP 2: mapping table -->
  <div class="card hidden" id="mapping-card">
    <div id="mapping-status" class="notice info"></div>
    <table>
      <thead>
        <tr>
          <th>Source Header</th>
          <th>Proposed CRM Field</th>
          <th>Confidence</th>
          <th>Status</th>
          <th>Change Mapping</th>
        </tr>
      </thead>
      <tbody id="mapping-tbody"></tbody>
    </table>

    <div class="approve-bar">
      <span id="review-count-text" style="font-size:13px;color:var(--muted)"></span>
      <button class="btn-primary" id="approve-btn" onclick="approveMapping()" disabled>✅ Approve &amp; Commit to Master</button>
    </div>
  </div>

  <div id="result-card" class="card hidden"></div>
</div>

<!-- Searchable field-picker modal, replacing prompt() -->
<div class="modal-overlay hidden" id="field-picker-modal" onclick="if(event.target===this) closeFieldPicker()">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="field-picker-title">Change Mapping</h3>
      <button class="modal-close" onclick="closeFieldPicker()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="field-picker-search" placeholder="Search 158 CRM fields…" oninput="filterFieldOptions()">
    </div>
    <div class="modal-list" id="field-picker-list"></div>
  </div>
</div>

<script>
var CRM_MASTER_LEADS_SCHEMA = [

  "R2-Maintenance Arrears Amount",

  "R3-Resort Name.id",
  "R3-Resort Name",

  "R3-Monthly Mortgage payment",
  "R3-Mait / Tax fees",
  "R3-How far behind on mortgage (Months)",
  "R3-Mortgage Arrears Amount",
  "R3-How far behind on mait fees (Months)",
  "R3-Maintenance Arrears Amount",
  "R3-Why do they want out?",
  "R3-Date Purchased (Roughly)",

  "R4-How far behind on mait fees (Months)",
  "R4-Maintenance Arrears Amount",
  "R4-Why do they want out?",
  "R4-Date Purchased (Roughly)",
  "R4-Purchase Price",
  "R4-How many Points",
  "R4-How many Weeks",
  "R4-Current on mortgage",
  "R4-Usage",
  "R4-Unit Size",
  "R4-Points or weeks",
  "R4-Current on Mait fees",
  "R4-Method of Payment",
  "R4-Mortgage status",
  "R4-Amount Charging",
  "R4-TOTAL",
  "R4-FIN TERM",
  "R4-% INTEREST",
  "R4-MONTHLY PAYMENTS",
  "R4-DOWN PAYMENT",
  "R4-True Cost of Ownership",
  "TOTAL RESORTS",
  "COMBINED MONTHLY TOTAL",
  "COMBINED YEARLY TOTAL",
  "COMBINED TRUE COST OF OWNERSHIP",
  "Priority",
  "Follow-Up Date",
  "Appointment Date & Time",
  "Savings",
  "Contact YES/NO",
  "Attempts",
  "Last Attempt",
  "Conversations",
  "Conversation Dates",
  "Emails",
  "Email Dates",
  "Texts",
  "Text Dates",
  "Main Objection",
  "Biggest Motivator",
  "Biggest Pain Point",
  "Rebuttal Link",
  "Additional Notes",
  "UUID",
  "Lead-Created-Time",
  "Deal Closed",
  "Resolution Recovery"
];
var API_BASE = 'https://sebastianlinks-crm-api.sebastianshort624.workers.dev';
var currentUploadId = null;
var currentMapping = [];

function qs(id) { return document.getElementById(id); }
function getPassphrase() { return sessionStorage.getItem('queuePassphrase') || ''; }
function authHeaders() { return { 'X-Queue-Passphrase': getPassphrase(), 'Content-Type': 'application/json' }; }

function submitPassphrase() {
  var v = qs('passphrase-input').value.trim();
  if (!v) return;
  sessionStorage.setItem('queuePassphrase', v);
  qs('passphrase-card').classList.add('hidden');
  qs('find-upload-card').classList.remove('hidden');

  var urlUploadId = new URLSearchParams(window.location.search).get('upload_id');
  if (urlUploadId) {
    qs('upload-id-input').value = urlUploadId;
    loadMapping();
  }
}

async function loadMapping() {
  var uploadId = qs('upload-id-input').value.trim();
  if (!uploadId) return;
  currentUploadId = uploadId;

  try {
    var resp = await fetch(API_BASE + '/api/import/mapping?upload_id=' + encodeURIComponent(uploadId), { headers: authHeaders() });
    if (resp.status === 401) {
      sessionStorage.removeItem('queuePassphrase');
      qs('passphrase-card').classList.remove('hidden');
      qs('find-upload-card').classList.add('hidden');
      qs('passphrase-status').textContent = 'Incorrect passphrase. Try again.';
      qs('passphrase-status').classList.remove('hidden');
      return;
    }
    var data = await resp.json();
    if (!data.ok) { alert('Error: ' + data.error); return; }

    currentMapping = data.mapping;
    qs('find-upload-card').classList.add('hidden');
    qs('mapping-card').classList.remove('hidden');
    renderMapping(data);
  } catch (e) {
    alert('Could not reach the CRM API: ' + e.message);
  }
}

function renderMapping(data) {
  var reviewCount = currentMapping.filter(function(m) {
    return m.mapping_status === 'proposed_low' || m.mapping_status === 'needs_review_conflict';
  }).length;

  var statusEl = qs('mapping-status');
  if (reviewCount > 0) {
    statusEl.className = 'notice warning';
    statusEl.textContent = reviewCount + ' column(s) need review before you can approve — highlighted below.';
  } else {
    statusEl.className = 'notice success';
    statusEl.textContent = 'All columns resolved. Ready to approve.';
  }

  qs('review-count-text').textContent = reviewCount > 0
    ? reviewCount + ' column(s) still need review'
    : (currentMapping.length + ' columns mapped, all resolved');
  qs('approve-btn').disabled = reviewCount > 0;

  var tbody = qs('mapping-tbody');
  tbody.innerHTML = '';
  currentMapping.forEach(function(col) {
    var needsReview = col.mapping_status === 'proposed_low' || col.mapping_status === 'needs_review_conflict';
    var confidence = col.mapping_status.indexOf('high') !== -1 ? 'high'
      : col.mapping_status.indexOf('medium') !== -1 ? 'medium'
      : col.mapping_status.indexOf('low') !== -1 ? 'low'
      : col.mapping_status === 'needs_review_conflict' ? 'low' : 'none';

    var tr = document.createElement('tr');
    tr.className = needsReview ? 'row-flagged' : '';

    var td1 = document.createElement('td'); td1.className = 'source-header'; td1.textContent = col.original_header;
    var td2 = document.createElement('td'); td2.textContent = col.mapped_destination || '—';
    var td3 = document.createElement('td'); td3.innerHTML = '<span class="confidence-pill confidence-' + confidence + '">' + confidence + '</span>';
    var td4 = document.createElement('td');
    var statusLabel = needsReview ? 'Needs Review' : (col.mapping_status === 'unmapped' ? 'Unmapped' : col.mapping_status === 'ignored' ? 'Ignored' : 'OK');
    td4.innerHTML = '<span class="status-pill ' + (needsReview ? 'status-review' : 'status-ok') + '">' + statusLabel + '</span>';

    var td5 = document.createElement('td');
    var btn = document.createElement('button');
    btn.className = 'btn-secondary';
    btn.textContent = 'Change Mapping';
    btn.onclick = function() { openChangeMapping(col); };
    td5.appendChild(btn);

    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5);
    tbody.appendChild(tr);
  });
}

var pickerActiveColumn = null;

function openChangeMapping(col) {
  pickerActiveColumn = col;
  qs('field-picker-title').textContent = 'Change Mapping — "' + col.original_header + '"';
  qs('field-picker-search').value = '';
  renderFieldOptions('');
  qs('field-picker-modal').classList.remove('hidden');
  qs('field-picker-search').focus();
}

function closeFieldPicker() {
  qs('field-picker-modal').classList.add('hidden');
  pickerActiveColumn = null;
}

function filterFieldOptions() {
  renderFieldOptions(qs('field-picker-search').value.trim().toLowerCase());
}

function renderFieldOptions(filterText) {
  var listEl = qs('field-picker-list');
  listEl.innerHTML = '';

  function addOption(label, className, onClick) {
    var div = document.createElement('div');
    div.className = 'modal-option' + (className ? ' ' + className : '');
    div.textContent = label;
    div.onclick = onClick;
    listEl.appendChild(div);
  }

  // Special options always shown first, regardless of search text
  if (!filterText || 'unmapped'.indexOf(filterText) !== -1) {
    addOption('UNMAPPED — Preserve Source Only', 'special', function() { pickMapping('UNMAPPED'); });
  }
  if (!filterText || 'ignore'.indexOf(filterText) !== -1) {
    addOption('IGNORE — Skip This Column', 'special ignore', function() { pickMapping('IGNORE'); });
  }

  var matches = CRM_MASTER_LEADS_SCHEMA.filter(function(f) {
    return !filterText || f.toLowerCase().indexOf(filterText) !== -1;
  });

  matches.forEach(function(field) {
    addOption(field, '', function() { pickMapping(field); });
  });

  if (matches.length === 0 && filterText) {
    var none = document.createElement('div');
    none.style.cssText = 'padding:10px 12px;color:var(--muted);font-size:13px';
    none.textContent = 'No matching fields.';
    listEl.appendChild(none);
  }
}

function pickMapping(choice) {
  var col = pickerActiveColumn;
  if (!col) return;
  closeFieldPicker();

  var body;
  if (choice === 'UNMAPPED') {
    body = { upload_id: currentUploadId, column_number: col.column_number, status: 'unmapped' };
  } else if (choice === 'IGNORE') {
    body = { upload_id: currentUploadId, column_number: col.column_number, status: 'ignored' };
  } else {
    body = { upload_id: currentUploadId, column_number: col.column_number, mapped_destination: choice, status: 'user_corrected' };
  }

  fetch(API_BASE + '/api/import/mapping/correct', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (!result.ok) { alert('Error: ' + result.error); return; }
      loadMapping();
    })
    .catch(function(e) { alert('Could not save correction: ' + e.message); });
}

async function approveMapping() {
  if (!confirm('Approve this mapping and commit to the CRM Master? This will normalize all rows and run duplicate detection.')) return;

  try {
    var resp = await fetch(API_BASE + '/api/import/approve', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ upload_id: currentUploadId }) });
    var data = await resp.json();
    var resultEl = qs('result-card');
    resultEl.classList.remove('hidden');

    if (!data.ok) {
      resultEl.innerHTML = '<div class="notice error">Approval failed: ' + (data.error || 'unknown error') + '</div>';
      return;
    }

    resultEl.innerHTML =
      '<div class="notice success">✅ Approved and committed.</div>' +
      '<p><strong>' + data.master_records_created + '</strong> new master records created<br>' +
      '<strong>' + data.master_records_merged_into_existing + '</strong> merged into existing duplicate records<br>' +
      '<strong>' + data.total_processed + '</strong> total rows processed</p>';
  } catch (e) {
    alert('Could not reach the CRM API: ' + e.message);
  }
}

// Skip the passphrase prompt if already unlocked this session
if (getPassphrase()) {
  qs('passphrase-card').classList.add('hidden');
  qs('find-upload-card').classList.remove('hidden');
  var urlUploadId = new URLSearchParams(window.location.search).get('upload_id');
  if (urlUploadId) {
    qs('upload-id-input').value = urlUploadId;
    loadMapping();
  }
}
</script>

</html>
