<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Project Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F8FA;
  --card: #FFFFFF;
  --text: #1C1E21;
  --muted: #8A8F98;
  --border: #ECEDF0;
  --radius: 20px;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1000px; margin: 0 auto; padding: 48px 24px 80px; }
.header { text-align: center; margin-bottom: 44px; }
.header h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 8px; }
.header p { color: var(--muted); font-size: 15px; margin: 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 18px;
}
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  text-decoration: none;
  color: var(--text);
  display: block;
  transition: transform .15s ease, box-shadow .15s ease;
  border: 1px solid var(--border);
}
.card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(0,0,0,.04), 0 16px 32px rgba(0,0,0,.08); }
.card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-emoji { font-size: 28px; }
.status-pill {
  font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 100px;
  text-transform: uppercase; letter-spacing: .4px;
}
.card-name { font-size: 17px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.2px; }
.card-desc { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; min-height: 20px; }
.footer-note { text-align: center; margin-top: 40px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🤖 AI Project Command Center</h1>
    <p>Home base for every AI-assisted project — files, decisions, tasks, and instructions in one place.</p>
    <div style="margin-top:16px;display:flex;gap:10px;justify-content:center">
      <a href="system-rules.html" style="font-size:13px;font-weight:600;color:#5B8DEF;text-decoration:none;background:#EAF1FE;padding:8px 16px;border-radius:100px">⚙️ System Rules</a>
      <a href="conversations.html" style="font-size:13px;font-weight:600;color:#5B8DEF;text-decoration:none;background:#EAF1FE;padding:8px 16px;border-radius:100px">💬 AI Conversations</a>
    </div>
  </div>
  <div class="grid" id="project-grid"></div>
  <div class="footer-note">Loading from projects.json — data only, no backend.</div>
</div>

<script>
fetch('projects.json')
  .then(function(r) { return r.json(); })
  .then(function(projects) {
    var grid = document.getElementById('project-grid');
    grid.innerHTML = projects.map(function(p) {
      var statusHtml = p.status
        ? '<span class="status-pill" style="background:' + p.colorSoft + ';color:' + p.color + '">' + p.status + '</span>'
        : '';
      return '<a class="card" href="project.html?id=' + encodeURIComponent(p.id) + '">' +
        '<div class="card-top"><span class="card-emoji">' + p.emoji + '</span>' + statusHtml + '</div>' +
        '<div class="card-name">' + p.name + '</div>' +
        '<p class="card-desc">' + (p.description || '') + '</p>' +
        '</a>';
    }).join('');
    document.querySelector('.footer-note').textContent = projects.length + ' projects loaded';
  })
  .catch(function(e) {
    document.getElementById('project-grid').innerHTML = '<p style="color:#c0392b">Could not load projects.json: ' + e.message + '</p>';
  });
</script>
</body>
</html>
