<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Workspace — AI Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F8FA;
  --card: #FFFFFF;
  --text: #1C1E21;
  --muted: #8A8F98;
  --border: #ECEDF0;
  --radius: 20px;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 32px 24px 80px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
.project-header {
  background: var(--card); border-radius: var(--radius); padding: 28px 28px 24px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 20px;
}
.project-top { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.project-emoji { font-size: 34px; }
.project-name { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; margin: 0; }
.status-pill { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 100px; text-transform: uppercase; letter-spacing: .4px; margin-left: auto; }
.project-desc { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 2px; }
.tab-btn {
  font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 100px;
  border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

.panel { background: var(--card); border-radius: var(--radius); padding: 24px 28px; box-shadow: var(--shadow); border: 1px solid var(--border); min-height: 160px; }
.panel h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 14px; }
.empty-state { color: var(--muted); font-size: 14px; padding: 20px 0; text-align: center; }
.item-row { padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.item-row:last-child { border-bottom: none; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← All Projects</a>

  <div class="project-header" id="project-header">
    <div class="project-top">
      <span class="project-emoji" id="p-emoji">—</span>
      <h1 class="project-name" id="p-name">Loading…</h1>
      <span class="status-pill" id="p-status"></span>
    </div>
    <p class="project-desc" id="p-desc"></p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview" onclick="showTab('overview')">Overview</button>
    <button class="tab-btn" data-tab="roadmap" onclick="showTab('roadmap')">Roadmap</button>
    <button class="tab-btn" data-tab="tasks" onclick="showTab('tasks')">Tasks</button>
    <button class="tab-btn" data-tab="files" onclick="showTab('files')">Files</button>
    <button class="tab-btn" data-tab="decisions" onclick="showTab('decisions')">Decisions</button>
    <button class="tab-btn" data-tab="instructions" onclick="showTab('instructions')">AI Instructions</button>
    <button class="tab-btn" data-tab="memory" onclick="showTab('memory')">AI Memory</button>
  </div>

  <div class="panel" id="panel-overview"><h3>Overview</h3><div id="overview-body"></div></div>
  <div class="panel hidden" id="panel-roadmap"><h3>Roadmap</h3><div class="empty-state">No roadmap items yet.</div></div>
  <div class="panel hidden" id="panel-tasks"><h3>Tasks</h3><div id="tasks-body"></div></div>
  <div class="panel hidden" id="panel-files"><h3>Files</h3><div id="files-body"></div></div>
  <div class="panel hidden" id="panel-decisions"><h3>Decisions</h3><div id="decisions-body"></div></div>
  <div class="panel hidden" id="panel-instructions"><h3>AI Instructions</h3><div id="instructions-body"></div></div>
  <div class="panel hidden" id="panel-memory">
    <h3>Rules</h3><div id="memory-rules-body"></div>
    <h3 style="margin-top:22px">Current State</h3><div id="memory-state-body"></div>
    <h3 style="margin-top:22px">Important Decisions</h3><div id="memory-decisions-body"></div>
  </div>
</div>

<script>
function getUrlParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function renderList(containerId, items, formatFn) {
  var el = document.getElementById(containerId);
  if (!items || items.length === 0) {
    el.innerHTML = '<div class="empty-state">Nothing here yet.</div>';
    return;
  }
  el.innerHTML = items.map(function(item) {
    return '<div class="item-row">' + formatFn(item) + '</div>';
  }).join('');
}

function showTab(tabName) {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.querySelectorAll('.panel').forEach(function(panel) {
    panel.classList.toggle('hidden', panel.id !== 'panel-' + tabName);
  });
}

var projectId = getUrlParam('id');

fetch('projects.json')
  .then(function(r) { return r.json(); })
  .then(function(projects) {
    var project = projects.find(function(p) { return p.id === projectId; });

    if (!project) {
      document.getElementById('p-name').textContent = 'Project not found';
      document.getElementById('p-emoji').textContent = '❓';
      document.getElementById('overview-body').innerHTML = '<div class="empty-state">No project matches id "' + (projectId || '') + '".</div>';
      return;
    }

    document.getElementById('p-emoji').textContent = project.emoji || '';
    document.getElementById('p-name').textContent = project.name;
    document.getElementById('p-desc').textContent = project.description || '';

    var statusEl = document.getElementById('p-status');
    if (project.status) {
      statusEl.textContent = project.status;
      statusEl.style.background = project.colorSoft || '#eee';
      statusEl.style.color = project.color || '#333';
    } else {
      statusEl.remove();
    }

    document.getElementById('overview-body').innerHTML = project.description
      ? '<p style="font-size:14px;line-height:1.6;color:#333">' + project.description + '</p>'
      : '<div class="empty-state">No overview yet.</div>';

    renderList('tasks-body', project.tasks, function(t) { return typeof t === 'string' ? t : JSON.stringify(t); });
    renderList('files-body', project.files, function(f) { return typeof f === 'string' ? f : JSON.stringify(f); });
    renderList('decisions-body', project.decisions, function(d) { return typeof d === 'string' ? d : JSON.stringify(d); });
    renderList('instructions-body', project.instructions, function(i) { return typeof i === 'string' ? i : JSON.stringify(i); });

    var mem = project.memory || { rules: [], current_state: [], important_decisions: [] };
    renderList('memory-rules-body', mem.rules, function(x) { return x; });
    renderList('memory-state-body', mem.current_state, function(x) { return x; });
    renderList('memory-decisions-body', mem.important_decisions, function(x) { return x; });
  })
  .catch(function(e) {
    document.getElementById('p-name').textContent = 'Error loading project';
    document.getElementById('overview-body').innerHTML = '<div class="empty-state">' + e.message + '</div>';
  });
</script>
</body>
</html>
