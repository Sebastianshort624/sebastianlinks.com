<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Conversations — AI Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F8FA; --card: #FFFFFF; --text: #1C1E21; --muted: #8A8F98;
  --border: #ECEDF0; --radius: 20px; --accent: #5B8DEF; --accent-soft: #EAF1FE;
  --shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 24px rgba(0,0,0,.05);
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 820px; margin: 0 auto; padding: 32px 24px 80px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 20px; }
.back-link:hover { color: var(--text); }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.4px; margin: 0 0 6px; }
.subtitle { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
.empty-state { background: var(--card); border-radius: var(--radius); padding: 40px 28px; text-align: center; color: var(--muted); font-size: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.convo-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.convo-header { padding: 18px 22px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.convo-title { font-size: 15px; font-weight: 700; }
.convo-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 100px; margin-right: 4px; }
.chevron { color: var(--muted); font-size: 14px; transition: transform .15s; }
.convo-content { display: none; padding: 0 22px 22px; }
.convo-content.open { display: block; }
.convo-content pre {
  white-space: pre-wrap; word-wrap: break-word; font-family: 'Inter', sans-serif; font-size: 13px;
  line-height: 1.6; background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin: 0; max-height: 500px; overflow-y: auto;
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← AI Center</a>
  <h1>💬 AI Conversations</h1>
  <p class="subtitle">Verbatim architecture discussions and build conversations, preserved exactly as posted (see System Rules → POST AI).</p>
  <div id="convo-list"></div>
</div>

<script>
function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toggleConvo(id) {
  var el = document.getElementById('content-' + id);
  var chev = document.getElementById('chevron-' + id);
  var isOpen = el.classList.toggle('open');
  chev.textContent = isOpen ? '▲' : '▼';
}

fetch('conversations.json')
  .then(function(r) { return r.json(); })
  .then(function(conversations) {
    var el = document.getElementById('convo-list');
    if (!conversations.length) {
      el.innerHTML = '<div class="empty-state">No AI conversations stored yet.<br>Paste <strong>POST AI:</strong> followed by a conversation to add one.</div>';
      return;
    }
    el.innerHTML = conversations.map(function(c, i) {
      var tags = (c.tags || []).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      return '<div class="convo-card">' +
        '<div class="convo-header" onclick="toggleConvo(' + i + ')">' +
        '<div><div class="convo-title">' + esc(c.title || 'Untitled') + '</div>' +
        '<div class="convo-meta">' + esc(c.dateAdded || '') + (c.category ? ' · ' + esc(c.category) : '') + (c.relatedProject ? ' · ' + esc(c.relatedProject) : '') + '</div>' +
        (tags ? '<div style="margin-top:6px">' + tags + '</div>' : '') + '</div>' +
        '<span class="chevron" id="chevron-' + i + '">▼</span></div>' +
        '<div class="convo-content" id="content-' + i + '"><pre>' + esc(c.content || '') + '</pre></div>' +
        '</div>';
    }).join('');
  })
  .catch(function(e) {
    document.getElementById('convo-list').innerHTML = '<p style="color:#c0392b">Could not load conversations.json: ' + e.message + '</p>';
  });
</script>
</body>
</html>
